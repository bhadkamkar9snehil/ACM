[project]
name = "acm"
version = "2.0.0a0"
description = "ACM - unsupervised, self-validating asset condition monitoring (the gem architecture spine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "numpy>=2.4.6",
    "polars>=1.0",
    "pyarrow>=15.0",
    # Windows ships no IANA tz database; polars timezone ops need it there.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.50.0",
    # WebSocket protocol support for the real-time UI stream (/api/ws)
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.28.1",
]
tier2 = [
    "torch>=2.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --basetemp: the default user temp dir on the dev box has broken ACLs
# (stale pytest-of-Admin, undeletable); a repo-local basetemp avoids it
# everywhere and is gitignored.
addopts = "-q --basetemp=.pytest_tmp"
markers = [
    "statistical: statistical-acceptance lane (immune harness, conformance gates)",
]
