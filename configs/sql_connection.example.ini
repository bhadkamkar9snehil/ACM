# Example SQL connection configuration (do not commit real secrets).
# Copy to `sql_connection.ini` and fill with your environment.
#
# These section names match SQLClient.from_ini(), db_health_check.py,
# install/install_acm.py, and the host-aware agent runner.

[acm]
server=localhost\SQLEXPRESS
database=ACM
trusted_connection=yes
driver=ODBC Driver 18 for SQL Server
trust_server_certificate=yes
mars=yes

[xstudio_historian]
server=localhost\SQLEXPRESS
database=XStudio_Historian
trusted_connection=yes

[xstudio_dow]
server=localhost\SQLEXPRESS
database=XStudio_DOW
trusted_connection=yes
