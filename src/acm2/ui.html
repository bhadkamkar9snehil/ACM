<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ACM2</title>
<style>
:root{
 --bg:#0c1116;--bg2:#121a22;--bg3:#182230;--line:#223041;--txt:#dbe4ee;
 --mut:#7d8ea1;--ok:#37b26c;--warn:#d8b636;--bad:#e05252;--chg:#d88a36;
 --ins:#5b6b7d;--acc:#4aa3df;}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 Consolas,Menlo,monospace;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;
 background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;letter-spacing:1px}
header .meta{color:var(--mut);font-size:12px}
header .spacer{flex:1}
button{font:inherit;font-size:12px;color:var(--txt);background:var(--bg3);
 border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc);color:#fff}
button.danger:hover{border-color:var(--bad)}
button:disabled{opacity:.4;cursor:wait}
.pill{display:inline-block;padding:1px 9px;border-radius:9px;font-size:11px;
 border:1px solid var(--line);background:var(--bg3);cursor:pointer;white-space:nowrap}
.pill.on{outline:1px solid var(--acc)}
.st-healthy{background:#12331f;color:#7fe0a8;border-color:#1d4d30}
.st-watch{background:#33300f;color:#e6d87a;border-color:#4d491d}
.st-alarm{background:#3a1414;color:#f09a9a;border-color:#5c2020}
.st-escalating{background:#3a1414;color:#f09a9a;border-color:#5c2020;font-weight:bold}
.st-change-not-fault{background:#33230f;color:#e6b87a;border-color:#4d3a1d}
.st-insufficient-history{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
#bar{display:flex;gap:8px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar input{font:inherit;font-size:12px;background:var(--bg3);color:var(--txt);
 border:1px solid var(--line);border-radius:4px;padding:5px 10px;width:240px}
main{display:grid;grid-template-columns:minmax(380px,32%) 1fr;height:calc(100vh - 92px)}
#list{overflow-y:auto;border-right:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 16px;
 border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--bg3);border-left:3px solid var(--acc);padding-left:13px}
.row .key{font-weight:bold;overflow:hidden;text-overflow:ellipsis}
.row .sub{grid-column:1/3;display:flex;gap:12px;color:var(--mut);font-size:11px;align-items:center}
.evbar{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.evbar i{display:block;height:100%;background:var(--acc)}
#detail{overflow-y:auto;padding:16px 20px 60px}
#detail .dhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#detail h2{font-size:17px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card h3{font-size:11px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-bottom:9px}
.card.wide{grid-column:1/-1}
pre{white-space:pre-wrap;font-size:12.5px;line-height:1.65}
.dom{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.dom .bar{height:9px;background:var(--bg3);border-radius:4px;overflow:hidden}
.dom .bar i{display:block;height:100%}
canvas{width:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:normal}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv b{color:var(--mut);font-weight:normal}
.organ{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border:1px solid var(--line);
 border-radius:4px;font-size:11.5px;background:var(--bg3)}
.organ.origin{border-color:var(--bad);color:#f09a9a}
@media (max-width:900px){
 main{grid-template-columns:1fr;height:auto}
 #list{max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
}
#toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:9}
#toast div{background:var(--bg3);border:1px solid var(--acc);border-radius:4px;
 padding:8px 14px;font-size:12px;animation:fade 4s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.muted{color:var(--mut)}
</style></head><body>
<header>
 <h1>ACM2</h1><span class="meta" id="meta"></span>
 <span class="spacer"></span>
 <span class="meta" id="immune-meta"></span>
 <button onclick="act('tick','', 'Scoring all assets')">Tick all</button>
</header>
<div id="bar">
 <input id="q" placeholder="filter assets... ( / )">
 <span id="pills"></span>
</div>
<main>
 <div id="list"></div>
 <div id="detail"><p class="muted" style="padding:30px">Select an asset.</p></div>
</main>
<div id="toast"></div>
<script>
"use strict";
let FLEET=null, SEL=null, FILTER=null, HEALTH={};
const $=(s)=>document.querySelector(s);
const esc=encodeURIComponent;
function toast(m){const d=document.createElement('div');d.textContent=m;
 $('#toast').appendChild(d);setTimeout(()=>d.remove(),4200);}
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json();}
async function act(kind,key,msg){
 toast(msg+'...');
 const url=kind==='tick'&&!key?'/api/tick':`/api/${kind}/${esc(key)}`;
 try{const r=await fetch(url,{method:'POST'});const d=await r.json();
  toast(msg+': done '+JSON.stringify(d).slice(0,90));await refresh();if(SEL)await detail(SEL);}
 catch(e){toast('FAILED: '+e.message);}}
function spark(cv,data,h){
 const w=cv.width=cv.clientWidth*2,hh=cv.height=h*2,c=cv.getContext('2d');
 c.clearRect(0,0,w,hh);if(!data||data.length<2)return;
 const mn=Math.min(...data),mx=Math.max(...data),sp=(mx-mn)||1;
 c.beginPath();c.strokeStyle='#4aa3df';c.lineWidth=2;
 data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=hh-4-((v-mn)/sp)*(hh-8);
  i?c.lineTo(x,y):c.moveTo(x,y);});
 c.stroke();}
function chart(cv,data){
 const w=cv.width=cv.clientWidth*2,h=cv.height=320,c=cv.getContext('2d');
 c.clearRect(0,0,w,h);if(!data||data.length<2){c.fillStyle='#7d8ea1';
  c.font='22px Consolas';c.fillText('no trajectory yet',20,40);return;}
 const mn=Math.min(...data),mx=Math.max(...data),sp=(mx-mn)||1;
 c.strokeStyle='#223041';c.lineWidth=1;
 for(let g=0;g<5;g++){const y=10+g*(h-30)/4;c.beginPath();c.moveTo(46,y);c.lineTo(w-6,y);c.stroke();
  c.fillStyle='#7d8ea1';c.font='18px Consolas';
  c.fillText((mx-g*sp/4).toFixed(2),2,y+6);}
 c.beginPath();c.strokeStyle='#4aa3df';c.lineWidth=2.5;
 data.forEach((v,i)=>{const x=46+i/(data.length-1)*(w-56),y=10+(1-(v-mn)/sp)*(h-30);
  i?c.lineTo(x,y):c.moveTo(x,y);});
 c.stroke();}
function pillbar(counts){
 const order=['escalating','alarm','change-not-fault','watch','insufficient-history','healthy'];
 $('#pills').innerHTML=order.filter(s=>counts[s]).map(s=>
  `<span class="pill st-${s} ${FILTER===s?'on':''}" onclick="FILTER=FILTER==='${s}'?null:'${s}';render()">${s}: ${counts[s]}</span>`).join(' ');}
function render(){
 if(!FLEET)return;
 $('#meta').textContent=`${FLEET.assets} assets | tier ${FLEET.tier} | alpha=1/asset-year`;
 $('#immune-meta').textContent=`immune: ${FLEET.immune.checked} checked, ${FLEET.immune.sick} sick`;
 pillbar(FLEET.counts);
 const q=$('#q').value.toLowerCase();
 const rows=FLEET.rows.filter(v=>(!FILTER||v.state===FILTER)&&v.asset_key.toLowerCase().includes(q));
 $('#list').innerHTML=rows.map(v=>`
  <div class="row ${SEL===v.asset_key?'sel':''}" onclick="select('${esc(v.asset_key)}')">
   <span class="key">${v.asset_key}</span>
   <span class="pill st-${v.state}">${v.state}</span>
   <span class="sub">
    <span>ev ${v.evidence}</span>
    <span class="evbar"><i style="width:${Math.min(100,v.evidence*33)}%"></i></span>
    <span>conf ${v.confidence}</span>
    <canvas data-k="${v.asset_key}" style="width:90px;height:22px"></canvas>
   </span></div>`).join('');
 rows.forEach(v=>{const cv=document.querySelector(`canvas[data-k="${CSS.escape(v.asset_key)}"]`);
  if(cv&&HEALTH[v.asset_key])spark(cv,HEALTH[v.asset_key].slice(-120),11);});}
function select(k){SEL=decodeURIComponent(k);render();detail(SEL);}
function domBar(name,d){
 if(!d.enabled)return `<div class="dom"><span>${name}</span><span class="muted">disabled (thin data)</span><span></span></div>`;
 const pct=Math.min(100,Math.max(2,d.evidence*100));
 const col=d.alarmed?'var(--bad)':(d.evidence>0.5?'var(--warn)':'var(--ok)');
 return `<div class="dom"><span>${name}${d.alarmed?' [ALARMED]':''}</span>
  <span class="bar"><i style="width:${pct}%;background:${col}"></i></span>
  <span>${d.evidence}</span></div>`;}
async function detail(key){
 const [v,narr,doms,health]=await Promise.all([
  jget('/api/asset/'+esc(key)),jget('/api/narrative/'+esc(key)),
  jget('/api/domains/'+esc(key)),jget('/api/health/'+esc(key))]);
 HEALTH[key]=health.series;
 let immune=null;try{immune=await jget('/api/immune/'+esc(key));}catch(e){}
 const t=v.evidence_trail||{},anat=t.anatomy,hz=t.horizon,tm=t.trajectory_match;
 $('#detail').innerHTML=`
 <div class="dhead">
  <h2>${v.asset_key}</h2>
  <span class="pill st-${v.state}">${v.state}</span>
  <span class="muted">evidence ${v.evidence} | confidence ${v.confidence} | ${v.model_epoch}</span>
  <span class="spacer" style="flex:1"></span>
  <button onclick="act('tick','${esc(key)}','Scoring')">Score now</button>
  <button onclick="act('immune-pass','${esc(key)}','Immune pass (slow)')">Immune pass</button>
  <button onclick="act('bootstrap','${esc(key)}','Bootstrap (multi-pass)')">Bootstrap</button>
  <button class="danger" onclick="if(confirm('Close the open episode into the ledger and recalibrate from masked lifetime?'))act('reanchor','${esc(key)}','Re-anchor')">Re-anchor</button>
 </div>
 <div class="cards">
  <div class="card wide"><h3>Health narrative</h3><pre>${narr.narrative}</pre></div>
  <div class="card"><h3>Evidence domains (log-wealth / threshold)</h3>
   ${Object.entries(doms).map(([n,d])=>domBar(n,d)).join('')}</div>
  <div class="card"><h3>Coverage and contract</h3><div class="kv">
   <b>operating familiarity</b><span>${(v.coverage||{}).operating_point_familiarity??'n/a'}</span>
   <b>calibration rows</b><span>${(v.coverage||{}).calib_rows??'-'}</span>
   <b>scored rows</b><span>${(v.coverage||{}).scored_rows??'-'}</span>
   <b>attribution</b><span>${(v.attribution||[]).join(', ')||'-'}</span>
   <b>falsifiable by</b><span>${v.falsifiable_by}</span></div></div>
  <div class="card wide"><h3>Health index trajectory (windowed mean surprise)</h3>
   <canvas id="hchart"></canvas></div>
  ${anat?`<div class="card"><h3>Anatomy (origin highlighted)</h3>
   ${Object.entries(anat.onsets||{}).map(([o,s])=>
    `<span class="organ ${anat.origin===o?'origin':''}">${o}${s!==null?' @'+s:''}</span>`).join('')}
   <div class="kv" style="margin-top:8px"><b>organ surprise</b>
    <span>${Object.entries(anat.organ_surprise||{}).map(([o,s])=>o.split(',')[0]+'..='+s).join(' | ')}</span></div></div>`:''}
  ${(hz||tm)?`<div class="card"><h3>Prognosis</h3><div class="kv">
   ${hz?`<b>horizon</b><span>${hz.gated?`median ${hz.median_steps} steps (${hz.p10_steps}..${hz.p90_steps})${hz.provisional_level?' [level provisional]':''}`:'gated: '+hz.reason}</span>`:''}
   ${tm?`<b>trajectory match</b><span>episode ${tm.episode} (dist ${tm.distance}) - ~${tm.remaining_rows_estimate} rows to its peak</span>`:''}
  </div></div>`:''}
  ${immune&&!immune.status?`<div class="card wide"><h3>Immune self-test ${immune.sick?'[SICK - rebuild triggered]':'[healthy]'}</h3>
   <div class="kv"><b>conformance</b><span>${immune.conformance_ok}${immune.conformance_note?' - '+immune.conformance_note:''}</span>
    <b>pit</b><span>${immune.pit}</span><b>live degenerate</b><span>${immune.live_degenerate}</span></div>
   <table><tr><th>fault class</th><th>recipe floor (sigma)</th></tr>
    ${Object.entries(immune.floors||{}).map(([k,f])=>`<tr><td>${k}</td><td>${f??'not detected'}</td></tr>`).join('')}</table>
   ${immune.rehearsal?`<p style="margin-top:8px;font-size:12px">rehearsed manifold: floor ${immune.rehearsal.overall_floor} sigma,
    ${Math.round(immune.rehearsal.detected_fraction*100)}% of cells detected<br>
    <span class="muted">${immune.rehearsal.scope}</span></p>`:''}
  </div>`:'<div class="card"><h3>Immune self-test</h3><p class="muted">not yet run - use the Immune pass button</p></div>'}
 </div>`;
 chart($('#hchart'),health.series);}
async function refresh(){
 FLEET=await jget('/api/assets');
 const top=FLEET.rows.slice(0,30);
 await Promise.all(top.map(async v=>{
  try{HEALTH[v.asset_key]=(await jget('/api/health/'+esc(v.asset_key))).series;}catch(e){}}));
 render();}
$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});
refresh();setInterval(refresh,6000);
</script></body></html>
