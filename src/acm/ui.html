<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ACM</title>
<script src="/vendor/echarts.min.js"></script>
<style>
:root{
 --bg:#0c1116;--bg2:#121a22;--bg3:#182230;--line:#223041;--txt:#dbe4ee;
 --mut:#7d8ea1;--ok:#37b26c;--warn:#d8b636;--bad:#e05252;--chg:#d88a36;
 --ins:#5b6b7d;--acc:#4aa3df;
 /* chart palette - read by JS at render time so theme switches restyle
    every chart without a reload */
 --ch-text:#dbe4ee;--ch-axis:#7d8ea1;--ch-grid:#223041;--ch-border:#0c1116;
 --shadow:none;}
:root[data-theme="light"]{
 --bg:#f4f6f9;--bg2:#ffffff;--bg3:#e9edf3;--line:#d5dce6;--txt:#1d2733;
 --mut:#66788c;--ok:#1e8a50;--warn:#a8830a;--bad:#c73535;--chg:#b06a1a;
 --ins:#8494a8;--acc:#2277bb;
 --ch-text:#1d2733;--ch-axis:#66788c;--ch-grid:#dfe5ec;--ch-border:#ffffff;
 --shadow:0 1px 3px rgba(29,39,51,0.08);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 Consolas,Menlo,monospace;background:var(--bg);color:var(--txt);
 display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;overflow:hidden}
@media (max-width:900px){body{display:block;min-height:100%;overflow:auto}}
header{display:flex;align-items:center;gap:18px;padding:13px 24px;
 background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;letter-spacing:2px}
header .meta{color:var(--mut);font-size:12.5px}
header .spacer{flex:1}
#wsdot{width:9px;height:9px;border-radius:50%;background:var(--ins);display:inline-block}
#wsdot.on{background:var(--ok)}
button{font:inherit;font-size:12px;color:var(--txt);background:var(--bg3);
 border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc);color:#fff}
button.danger:hover{border-color:var(--bad)}
button:disabled{opacity:.4;cursor:wait}
.pill{display:inline-block;padding:1px 9px;border-radius:9px;font-size:11px;
 border:1px solid var(--line);background:var(--bg3);cursor:pointer;white-space:nowrap}
.pill.on{outline:1px solid var(--acc)}
.st-healthy{background:#12331f;color:#7fe0a8;border-color:#1d4d30}
.st-watch{background:#33300f;color:#e6d87a;border-color:#4d491d}
.st-alarm{background:#3a1414;color:#f09a9a;border-color:#5c2020}
.st-escalating{background:#3a1414;color:#f09a9a;border-color:#5c2020;font-weight:bold}
.st-change-not-fault{background:#33230f;color:#e6b87a;border-color:#4d3a1d}
.st-insufficient-history{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
.st-bootstrapping{background:#14283a;color:#7ab8f0;border-color:#20405c}
.st-onboarding{background:#1e1a33;color:#a99bf0;border-color:#332c56}
.st-queued{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
:root[data-theme="light"] .st-healthy{background:#dff3e7;color:#156a3d;border-color:#a9dfc2}
:root[data-theme="light"] .st-watch{background:#faf3d3;color:#7a6207;border-color:#e8d78a}
:root[data-theme="light"] .st-alarm{background:#fbe3e3;color:#a02525;border-color:#f0b3b3}
:root[data-theme="light"] .st-escalating{background:#fbe3e3;color:#a02525;border-color:#f0b3b3;font-weight:bold}
:root[data-theme="light"] .st-change-not-fault{background:#f8ead8;color:#8a5310;border-color:#eccb9d}
:root[data-theme="light"] .st-insufficient-history{background:#e9edf3;color:#5a6c80;border-color:#cfd8e2}
:root[data-theme="light"] .st-bootstrapping{background:#ddebfa;color:#1b5e9e;border-color:#a9cdef}
:root[data-theme="light"] .st-onboarding{background:#e8e3f8;color:#4f3ba8;border-color:#c8bdec}
:root[data-theme="light"] .st-queued{background:#e9edf3;color:#5a6c80;border-color:#cfd8e2}
#kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
 padding:14px 24px 0;background:var(--bg2)}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;
 padding:7px 14px;box-shadow:var(--shadow)}
:root[data-theme="light"] .kpi{background:var(--bg2)}
.kpi b{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mut);
 text-transform:uppercase;margin-bottom:1px;font-weight:normal}
.kpi span{font-size:19px;font-weight:bold;line-height:1.25}
.kpi small{color:var(--mut);font-size:11px;margin-left:6px}
.kpi.bad span{color:var(--bad)}.kpi.warn span{color:var(--warn)}
.kpi.ok span{color:var(--ok)}.kpi.acc span{color:var(--acc)}
#dash{display:grid;grid-template-columns:300px 1.2fr 1fr;gap:14px;padding:14px 24px;
 border-bottom:1px solid var(--line);background:var(--bg2)}
#dash .dchart{height:158px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
 box-shadow:var(--shadow)}
:root[data-theme="light"] #dash .dchart{background:var(--bg2)}
#bar{display:flex;gap:12px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar input{font:inherit;font-size:12.5px;background:var(--bg3);color:var(--txt);
 border:1px solid var(--line);border-radius:6px;padding:6px 12px;width:260px}
#pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(380px,30%) 1fr;min-height:0}
#act{height:148px;background:var(--bg2);
 border-top:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#act.min{height:28px}
#act-hdr{display:flex;gap:12px;align-items:center;padding:5px 24px;font-size:11px;
 color:var(--mut);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;
 letter-spacing:1px;text-transform:uppercase}
#act-hdr .dotlive{width:7px;height:7px;border-radius:50%;background:#37b26c;
 animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
#act-log{flex:1;overflow-y:auto;padding:6px 24px;font-size:12px;line-height:1.75}
#act.min #act-log{display:none}
#act-log .k{display:inline-block;min-width:66px;font-weight:bold}
#act-log .k-onboard{color:#a99bf0}#act-log .k-train{color:#8a76e0}
#act-log .k-bootstrap{color:#7ab8f0}#act-log .k-tick{color:#7fe0a8}
#act-log .k-service{color:#e6d87a}
#act-log .t{color:var(--mut)}#act-log .a{color:var(--txt);font-weight:bold}
:root[data-theme="light"] #act-log .k-onboard{color:#5a44c0}
:root[data-theme="light"] #act-log .k-train{color:#6a54cc}
:root[data-theme="light"] #act-log .k-bootstrap{color:#1b5e9e}
:root[data-theme="light"] #act-log .k-tick{color:#156a3d}
:root[data-theme="light"] #act-log .k-service{color:#7a6207}
#list{overflow-y:auto;border-right:1px solid var(--line);min-width:0}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 20px;
 border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--bg3);border-left-color:var(--acc)}
.row .key{font-weight:bold;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;
 align-self:center}
.row .sub{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto auto;
 gap:12px;color:var(--mut);font-size:11.5px;align-items:center}
.evbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:80px}
.evbar i{display:block;height:100%;background:var(--acc)}
#detail{overflow-y:auto;overflow-x:hidden;padding:20px 24px 28px;min-width:0}
#detail .dhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
 padding-bottom:14px;border-bottom:1px solid var(--line)}
#detail h2{font-size:19px;letter-spacing:0.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0;
 box-shadow:var(--shadow)}
.card h3{font-size:11px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-bottom:12px}
.card.wide{grid-column:1/-1}
.chart{width:100%}
pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:12.5px;line-height:1.65}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:normal}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv b{color:var(--mut);font-weight:normal}
.kv span,td,th{overflow-wrap:anywhere;word-break:break-word}
@media (max-width:1100px){#dash{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
 header{flex-wrap:wrap;gap:8px;padding:10px 16px}
 header .spacer{display:none}
 #dash{grid-template-columns:1fr;padding:8px 16px}
 #bar{padding:8px 16px}
 #bar input{width:100%}
 #pills{width:100%}
 main{grid-template-columns:1fr;height:auto}
 #list{max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
 .row{grid-template-columns:minmax(0,1fr) auto}
 .row .sub{gap:8px;flex-wrap:wrap}
 .evbar{min-width:90px}
 .cards{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:9}
#toast div{background:var(--bg3);border:1px solid var(--acc);border-radius:4px;
 padding:8px 14px;font-size:12px;animation:fade 4s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.muted{color:var(--mut)}
</style></head><body>
<header>
 <h1>ACM</h1><span class="meta" id="meta"></span>
 <span class="spacer"></span>
 <span id="wsdot" title="live stream"></span><span class="meta" id="wsmeta">connecting</span>
 <span class="meta" id="immune-meta"></span>
 <button onclick="toggleTheme()" title="toggle light/dark theme">theme</button>
 <button onclick="window.open('/api/report','_blank')">Report</button>
 <button onclick="act('tick','', 'Scoring all assets')">Tick all</button>
</header>
<div id="kpis"></div>
<div id="dash">
 <div class="dchart" id="d-states"></div>
 <div class="dchart" id="d-evidence"></div>
 <div class="dchart" id="d-scatter"></div>
</div>
<div id="bar">
 <input id="q" placeholder="filter assets... ( / )">
 <span id="pills"></span>
</div>
<main>
 <div id="list"></div>
 <div id="detail"><p class="muted" style="padding:30px">Select an asset.</p></div>
</main>
<div id="act" class="">
 <div id="act-hdr" onclick="document.getElementById('act').classList.toggle('min')">
  <span class="dotlive"></span><b>activity</b>
  <span id="act-count"></span>
  <span style="margin-left:auto">click to collapse/expand</span>
 </div>
 <div id="act-log"></div>
</div>
<div id="toast"></div>
<script>
"use strict";
let FLEET=null, SEL=null, FILTER=null, HEALTH={}, HASH='', DETAIL_AT='';
const $=(s)=>document.querySelector(s);
const esc=encodeURIComponent;
const SC={healthy:'#37b26c',watch:'#d8b636',alarm:'#e05252',escalating:'#ff6b6b',
 'change-not-fault':'#d88a36','insufficient-history':'#5b6b7d',
 bootstrapping:'#4a90d9',onboarding:'#8a76e0',queued:'#5b6b7d'};
const PENDING=['bootstrapping','onboarding','queued'];
const CHARTS={};
let CH={};
function reTheme(){
 const cs=getComputedStyle(document.documentElement);
 CH={text:cs.getPropertyValue('--ch-text').trim(),
  axis:cs.getPropertyValue('--ch-axis').trim(),
  grid:cs.getPropertyValue('--ch-grid').trim(),
  border:cs.getPropertyValue('--ch-border').trim()};
 BASE.textStyle.color=CH.text;}
const BASE={backgroundColor:'transparent',textStyle:{color:CH.text,fontFamily:'Consolas,Menlo,monospace'},
 animationDuration:250,animationDurationUpdate:250};
if(localStorage.getItem('acm-theme')==='light')
 document.documentElement.dataset.theme='light';
reTheme();
function toggleTheme(){
 const light=document.documentElement.dataset.theme!=='light';
 document.documentElement.dataset.theme=light?'light':'';
 localStorage.setItem('acm-theme',light?'light':'dark');
 reTheme();
 if(FLEET){dashboard();render();}
 if(SEL)detail(SEL,true);}
function ec(id,opt){
 const el=document.getElementById(id);if(!el)return null;
 let c=CHARTS[id];
 if(!c||c.getDom()!==el){if(c)c.dispose();c=CHARTS[id]=echarts.init(el,null,{renderer:'canvas'});}
 c.setOption(Object.assign({},BASE,opt),{replaceMerge:['series','xAxis','yAxis']});
 return c;}
addEventListener('resize',()=>Object.values(CHARTS).forEach(c=>c.resize()));
function stale(at){
 if(!at)return '';
 const t=Date.parse(String(at).replace(' ','T'));
 if(isNaN(t))return '';
 const h=(Date.now()-t)/3.6e6;
 return h>48?` <span style="color:var(--warn)">(stale ${Math.round(h)}h - asset clock may lag wall clock)</span>`:'';}
function toast(m){const d=document.createElement('div');d.textContent=m;
 $('#toast').appendChild(d);setTimeout(()=>d.remove(),4200);}
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json();}
async function act(kind,key,msg){
 toast(msg+'...');
 const url=kind==='tick'&&!key?'/api/tick':`/api/${kind}/${esc(key)}`;
 try{const r=await fetch(url,{method:'POST'});const d=await r.json();
  toast(msg+': done '+JSON.stringify(d).slice(0,90));
  if(!WS_ON)await refresh();if(SEL)await detail(SEL,true);}
 catch(e){toast('FAILED: '+e.message);}}
function spark(cv,data,h){
 const w=cv.width=cv.clientWidth*2,hh=cv.height=h*2,c=cv.getContext('2d');
 c.clearRect(0,0,w,hh);if(!data||data.length<2)return;
 const mn=Math.min(...data),mx=Math.max(...data),sp=(mx-mn)||1;
 c.beginPath();c.strokeStyle='#4aa3df';c.lineWidth=2;
 data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=hh-4-((v-mn)/sp)*(hh-8);
  i?c.lineTo(x,y):c.moveTo(x,y);});
 c.stroke();}

/* ------------------------------------------------ fleet dashboard */
function dashboard(){
 const counts=FLEET.counts,rows=FLEET.rows;
 ec('d-states',{title:{text:'fleet states',left:8,top:6,textStyle:{fontSize:11,color:CH.axis}},
  tooltip:{trigger:'item'},
  graphic:Object.keys(counts).length?[{type:'text',left:'center',top:'52%',
   style:{text:String(FLEET.assets),fill:CH.text,fontSize:26,fontWeight:'bold',
    fontFamily:'Consolas,Menlo,monospace',align:'center'}},
   {type:'text',left:'center',top:'67%',
   style:{text:'assets',fill:CH.axis,fontSize:10,
    fontFamily:'Consolas,Menlo,monospace',align:'center'}}]
   :[{type:'text',left:'center',top:'middle',
   style:{text:'no assets yet',fill:'#5b6b7d',fontSize:12,fontFamily:'Consolas,Menlo,monospace'}}],
  series:[{type:'pie',radius:['52%','78%'],center:['50%','58%'],
   label:{show:false},emphasis:{label:{show:false}},
   itemStyle:{borderColor:CH.border,borderWidth:2},
   data:Object.entries(counts).map(([s,n])=>({name:s,value:n,itemStyle:{color:SC[s]||'#888'}}))}]});
 const top=rows.slice(0,12);
 ec('d-evidence',{title:{text:'evidence - worst first (alarm at 1.0)',left:8,top:6,textStyle:{fontSize:11,color:CH.axis}},
  grid:{left:8,right:52,top:30,bottom:6,containLabel:true},
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
  xAxis:{type:'value',axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'category',inverse:true,data:top.map(r=>r.asset_key),
   axisLabel:{color:CH.text,fontSize:10,width:110,overflow:'truncate'}},
  series:[{type:'bar',data:top.map(r=>({value:r.evidence,itemStyle:{color:SC[r.state]||'#888',borderRadius:[0,3,3,0]}})),
   label:{show:true,position:'right',color:CH.axis,fontSize:10,
    formatter:p=>p.value>=0.005?p.value.toFixed(2):''},
   markLine:{symbol:'none',lineStyle:{color:'#e05252',type:'dashed'},
    label:{color:'#e05252',formatter:'alarm'},data:[{xAxis:1}]},
   barMaxWidth:12}]});
 const sc=ec('d-scatter',{title:{text:'confidence vs evidence (click = open)',left:8,top:6,textStyle:{fontSize:11,color:CH.axis}},
  grid:{left:8,right:20,top:30,bottom:6,containLabel:true},
  tooltip:{formatter:p=>`${p.data[3]}<br>evidence ${p.data[1]} | confidence ${p.data[0]}`},
  xAxis:{type:'value',name:'confidence',nameTextStyle:{color:CH.axis,fontSize:10},min:0,max:1,
   axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'log',min:0.01,axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  series:[{type:'scatter',symbolSize:d=>8+Math.min(14,d[1]*2),
   data:rows.map(r=>[r.confidence,Math.max(0.01,r.evidence),r.state,r.asset_key]),
   itemStyle:{color:p=>SC[p.data[2]]||'#888',opacity:0.85}}]});
 if(sc&&!sc.__wired){sc.__wired=true;sc.on('click',p=>{if(p.data&&p.data[3])select(esc(p.data[3]));});}}

/* ------------------------------------------------ fleet list */
function pillbar(counts){
 const order=['escalating','alarm','change-not-fault','watch','insufficient-history','healthy',
  'bootstrapping','onboarding','queued'];
 $('#pills').innerHTML=order.filter(s=>counts[s]).map(s=>
  `<span class="pill st-${s} ${FILTER===s?'on':''}" onclick="FILTER=FILTER==='${s}'?null:'${s}';render()">${s}: ${counts[s]}</span>`).join(' ');}
function renderKpis(){
 const c=FLEET.counts,rows=FLEET.rows;
 const alarms=(c.alarm||0)+(c.escalating||0);
 const watching=(c.watch||0)+(c['change-not-fault']||0);
 const pending=(c.queued||0)+(c.onboarding||0)+(c.bootstrapping||0);
 const worst=rows.length?rows[0]:null;
 const kpi=(cls,label,val,note)=>`<div class="kpi ${cls}"><b>${label}</b>`+
  `<span>${val}</span>${note?`<small>${note}</small>`:''}</div>`;
 $('#kpis').innerHTML=
  kpi('','fleet',FLEET.assets,pending?`${pending} pending`:'all verdicted')+
  kpi(alarms?'bad':'ok','alarms',alarms,alarms&&worst?worst.asset_key:'')+
  kpi(watching?'warn':'','watching',watching,'watch + change')+
  kpi('ok','healthy',c.healthy||0,'')+
  kpi(worst&&worst.evidence>=1?'bad':(worst&&worst.evidence>=0.5?'warn':''),
   'peak evidence',worst?worst.evidence.toFixed(2):'-',
   worst?`alarm at 1.0`:'')+
  kpi('acc','engine',FLEET.tier,FLEET.scorer||'');}
function render(){
 if(!FLEET)return;
 const tierScorer={'T2':'TorchWorldModel','T2-S':'TorchWorldModel'};
 const degraded=FLEET.scorer&&tierScorer[FLEET.tier]&&FLEET.scorer!==tierScorer[FLEET.tier];
 $('#meta').innerHTML=`${FLEET.assets} assets | tier ${FLEET.tier}`+
  (FLEET.scorer?` | ${degraded?`<span style="color:var(--bad);font-weight:bold" title="tier implies ${tierScorer[FLEET.tier]} but the service fell back">${FLEET.scorer} (DEGRADED)</span>`:FLEET.scorer}`:'')+
  ` | alpha=1/asset-year`;
 $('#immune-meta').innerHTML=`immune: ${FLEET.immune.checked} checked, `+
  (FLEET.immune.sick?`<span style="color:var(--bad);font-weight:bold">${FLEET.immune.sick} sick</span>`:'0 sick');
 renderKpis();
 pillbar(FLEET.counts);
 dashboard();
 const q=$('#q').value.toLowerCase();
 const rows=FLEET.rows.filter(v=>(!FILTER||v.state===FILTER)&&v.asset_key.toLowerCase().includes(q));
 const shown=rows.slice(0,400);
 if(!rows.length){
  $('#list').innerHTML=`<p class="muted" style="padding:24px 20px;line-height:1.7">${
   FLEET.rows.length?'No assets match the filter.':
   'No assets in the store yet.<br>Ingest data into the raw store (acm_data/raw) and the service will discover it on the next start; assets appear here the moment onboarding begins.'}</p>`;
  return;}
 $('#list').innerHTML=shown.map(v=>`
  <div class="row ${SEL===v.asset_key?'sel':''}" onclick="select('${esc(v.asset_key)}')">
   <span class="key">${v.asset_key}${v.live?' <span class="pill" style="font-size:10px" title="live buffer attached">LIVE</span>':''}</span>
   <span class="pill st-${v.state}">${v.state}</span>
   <span class="sub">
    <span>ev ${v.evidence}</span>
    <span class="evbar"><i style="width:${Math.min(100,v.evidence*33)}%"></i></span>
    <span>conf ${v.confidence}</span>
    <canvas data-k="${v.asset_key}" style="width:90px;height:22px"></canvas>
   </span></div>`).join('')+(rows.length>400?`<p class="muted" style="padding:10px 16px">and ${rows.length-400} more - refine the filter</p>`:'');
 shown.forEach(v=>{const cv=document.querySelector(`canvas[data-k="${CSS.escape(v.asset_key)}"]`);
  if(cv&&HEALTH[v.asset_key])spark(cv,HEALTH[v.asset_key].slice(-120),11);});}
function select(k){SEL=decodeURIComponent(k);render();detail(SEL,true);}

/* ------------------------------------------------ detail charts */
function domChart(doms){
 const names=Object.keys(doms),on=n=>doms[n].enabled;
 ec('c-domains',{grid:{left:8,right:40,top:8,bottom:6,containLabel:true},
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
  xAxis:{type:'value',max:v=>Math.max(1.2,v.max),axisLabel:{color:CH.axis,fontSize:10},
   splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'category',inverse:true,data:names,axisLabel:{color:CH.text,fontSize:11}},
  series:[{type:'bar',barMaxWidth:14,
   data:names.map(n=>{const d=doms[n];
    return {value:on(n)?d.evidence:0,
     itemStyle:{color:!on(n)?'#2a3a4d':d.alarmed?'#e05252':d.evidence>0.5?'#d8b636':'#37b26c'},
     label:{show:true,position:'right',fontSize:10,color:CH.axis,
      formatter:on(n)?(d.alarmed?'ALARMED':String(d.evidence)):'disabled (thin data)'}};}),
   markLine:{symbol:'none',lineStyle:{color:'#e05252',type:'dashed'},
    label:{color:'#e05252',formatter:'alarm'},data:[{xAxis:1}]}}]});}
function healthChart(series){
 ec('c-health',{grid:{left:10,right:16,top:14,bottom:40,containLabel:true},
  tooltip:{trigger:'axis'},
  dataZoom:[{type:'inside'},{type:'slider',height:16,bottom:6,borderColor:CH.grid,
   backgroundColor:'#121a22',fillerColor:'rgba(74,163,223,0.15)',textStyle:{color:CH.axis}}],
  xAxis:{type:'category',data:series.map((_,i)=>i),axisLabel:{color:CH.axis,fontSize:10}},
  yAxis:{type:'value',axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  series:[{type:'line',data:series,showSymbol:false,smooth:0.15,
   lineStyle:{color:'#4aa3df',width:2},
   areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,
    colorStops:[{offset:0,color:'rgba(74,163,223,0.30)'},{offset:1,color:'rgba(74,163,223,0.02)'}]}}}]});}
function episodeTimeline(eph){
 const items=eph.episodes.map(e=>({s:e.start,e:e.end||new Date().toISOString(),st:e.state,
  tip:`${e.state}<br>${e.start} -> ${e.end||'open'}<br>${(e.channels||[]).join(', ')||e.source||''}${e.shape?'<br>shape: '+e.shape:''}${e.peak_evidence!=null?'<br>peak evidence '+e.peak_evidence:''}`}));
 if(eph.open_since)items.push({s:eph.open_since,e:new Date().toISOString(),st:'open',
  tip:'OPEN episode since '+eph.open_since});
 if(!items.length)return;
 const col={alarm:'#e05252','change-not-fault':'#d88a36',intervention:'#4aa3df',open:'#ff6b6b'};
 ec('c-episodes',{grid:{left:10,right:16,top:10,bottom:24,containLabel:true},
  tooltip:{formatter:p=>p.data.tip},
  xAxis:{type:'time',axisLabel:{color:CH.axis,fontSize:10}},
  yAxis:{type:'category',data:['episodes'],axisLabel:{show:false}},
  series:[{type:'custom',
   renderItem:(params,api)=>{
    const y=api.coord([0,0])[1];
    const x1=api.coord([api.value(0),0])[0],x2=api.coord([api.value(1),0])[0];
    return {type:'rect',shape:{x:x1,y:y-11,width:Math.max(3,x2-x1),height:22},
     style:{fill:api.value(3)}};},
   encode:{x:[0,1]},
   data:items.map(i=>({value:[Date.parse(i.s.replace(' ','T')),Date.parse(i.e.replace(' ','T')),i.st,col[i.st]||'#888'],tip:i.tip}))}]});}
function anatomyChart(anat){
 const entries=Object.entries(anat.organ_surprise||{});
 if(!entries.length)return;
 const names=entries.map(([o])=>o.split(',').slice(0,2).join(',')+(o.split(',').length>2?'..':''));
 ec('c-anatomy',{grid:{left:8,right:30,top:8,bottom:6,containLabel:true},
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'},
   formatter:p=>entries[p[0].dataIndex][0]+'<br>surprise '+p[0].value},
  xAxis:{type:'value',axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'category',inverse:true,data:names,axisLabel:{color:CH.text,fontSize:10,width:130,overflow:'truncate'}},
  series:[{type:'bar',barMaxWidth:12,
   data:entries.map(([o,s])=>({value:s,
    itemStyle:{color:(anat.origin&&o.startsWith(anat.origin.split(',')[0]))?'#e05252':'#4aa3df'}}))}]});}
function gaugeChart(id,val,name){
 ec(id,{series:[{type:'gauge',min:0,max:1,radius:'95%',center:['50%','62%'],
  startAngle:200,endAngle:-20,
  progress:{show:true,width:10,itemStyle:{color:val>0.66?'#37b26c':val>0.33?'#d8b636':'#e05252'}},
  axisLine:{lineStyle:{width:10,color:[[1,CH.grid]]}},
  axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},
  pointer:{show:false},
  title:{show:true,offsetCenter:[0,'30%'],color:CH.axis,fontSize:11},
  detail:{valueAnimation:true,offsetCenter:[0,'-10%'],fontSize:20,color:CH.text,
   formatter:v=>v.toFixed(2)},
  data:[{value:val,name:name}]}]});}
function horizonChart(hz){
 ec('c-horizon',{grid:{left:10,right:26,top:14,bottom:8,containLabel:true},
  tooltip:{show:false},
  xAxis:{type:'value',name:'steps',nameTextStyle:{color:CH.axis,fontSize:10},
   axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'category',data:['failure time'],axisLabel:{color:CH.text,fontSize:11}},
  series:[
   {type:'bar',stack:'h',barMaxWidth:16,data:[hz.p10_steps],
    itemStyle:{color:'transparent'},tooltip:{show:false}},
   {type:'bar',stack:'h',barMaxWidth:16,data:[hz.p90_steps-hz.p10_steps],
    itemStyle:{color:'rgba(224,82,82,0.35)',borderColor:'#e05252',borderWidth:1},
    label:{show:true,position:'insideLeft',fontSize:10,color:'#f09a9a',
     formatter:()=>`p10 ${hz.p10_steps} | median ${hz.median_steps} | p90 ${hz.p90_steps}`},
    markLine:{symbol:'none',lineStyle:{color:'#e05252',width:2},
     data:[{xAxis:hz.median_steps}],label:{color:'#e05252',formatter:'median'}}}]});}
function immuneChart(immune){
 const entries=Object.entries(immune.floors||{});
 if(!entries.length)return;
 ec('c-immune',{grid:{left:8,right:36,top:8,bottom:6,containLabel:true},
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
  xAxis:{type:'value',name:'floor (sigma)',nameTextStyle:{color:CH.axis,fontSize:10},
   axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'category',inverse:true,data:entries.map(([k])=>k),
   axisLabel:{color:CH.text,fontSize:10}},
  series:[{type:'bar',barMaxWidth:12,
   data:entries.map(([,f])=>({value:f??0,
    itemStyle:{color:f==null?'#5b6b7d':'#37b26c'},
    label:{show:f==null,position:'right',fontSize:10,color:CH.axis,formatter:'not detected'}}))}]});}

/* ------------------------------------------------ detail view */
async function detail(key,force){
 const row=FLEET&&FLEET.rows.find(r=>r.asset_key===key);
 if(!force&&row&&row.at===DETAIL_AT)return;  // nothing new for this asset
 if(row&&PENDING.includes(row.state)){
  const why={queued:'waiting its turn',
   onboarding:'calibrating from its lifetime history',
   bootstrapping:'first-contact cleaning of its history'};
  $('#detail').innerHTML=`<p class="muted" style="padding:24px;line-height:1.7">${row.asset_key} is <span class="pill st-${row.state}">${row.state}</span> - ${why[row.state]}.<br>Its first verdict lands here automatically when that finishes.</p>`;
  return;}
 const [v,narr,doms,health,eph]=await Promise.all([
  jget('/api/asset/'+esc(key)),jget('/api/narrative/'+esc(key)),
  jget('/api/domains/'+esc(key)),jget('/api/health/'+esc(key)),
  jget('/api/episodes/'+esc(key))]);
 DETAIL_AT=v.at;
 HEALTH[key]=health.series;
 let immune=null;try{immune=await jget('/api/immune/'+esc(key));}catch(e){}
 const t=v.evidence_trail||{},anat=t.anatomy,hz=t.horizon,tm=t.trajectory_match;
 const fam=(v.coverage||{}).operating_point_familiarity;
 $('#detail').innerHTML=`
 <div class="dhead">
  <h2>${v.asset_key}</h2>
  <span class="pill st-${v.state}">${v.state}</span>
  <span class="muted">evidence ${v.evidence} | confidence ${v.confidence} | ${v.model_epoch}</span>
  <span class="muted" title="verdict timestamp (frozen contract field: at)">at ${v.at||'-'}${stale(v.at)}</span>
  ${row&&row.live?'<span class="pill" title="live buffer attached">LIVE</span>':''}
  <span class="spacer" style="flex:1"></span>
  <button onclick="act('tick','${esc(key)}','Scoring')">Score now</button>
  <button onclick="act('immune-pass','${esc(key)}','Immune pass (slow)')">Immune pass</button>
  <button onclick="act('bootstrap','${esc(key)}','Bootstrap (multi-pass)')">Bootstrap</button>
  <button class="danger" onclick="if(confirm('Close the open episode into the ledger and recalibrate from masked lifetime?'))act('reanchor','${esc(key)}','Re-anchor')">Re-anchor</button>
 </div>
 <div class="cards">
  <div class="card wide"><h3>Health narrative</h3><pre>${narr.narrative}</pre></div>
  <div class="card wide"><h3>Health index trajectory (windowed mean surprise)</h3>
   <div class="chart" id="c-health" style="height:240px"></div></div>
  <div class="card"><h3>Evidence domains (log-wealth / threshold, alarm at 1.0)</h3>
   <div class="chart" id="c-domains" style="height:190px"></div></div>
  <div class="card"><h3>Coverage: operating-point familiarity</h3>
   <div class="chart" id="c-coverage" style="height:150px"></div>
   <div class="kv">
    <b>calibration rows</b><span>${(v.coverage||{}).calib_rows??'-'}</span>
    <b>scored rows</b><span>${(v.coverage||{}).scored_rows??'-'}</span>
    <b>attribution</b><span>${(v.attribution||[]).join(', ')||'-'}</span>
    <b>falsifiable by</b><span>${v.falsifiable_by}</span></div></div>
  <div class="card"><h3>Evidence trail</h3><div class="kv">
   ${t.reason?`<b>insufficient because</b><span>${t.reason}</span>`:''}
   ${t.shape?`<b>surprise shape</b><span>${t.shape}</span>`:''}
   ${t.novelty!==undefined?`<b>novelty</b><span>${t.novelty}</span>`:''}
   ${t.concentration!==undefined?`<b>attribution concentration</b><span>${t.concentration} ${t.concentration<0.4?'(coordinated move)':'(channel-local)'}</span>`:''}
   ${eph.open_since?`<b>episode open since</b><span>${eph.open_since}</span>`:''}
   ${t.signature_match?`<b>signature match</b><span>episode ${t.signature_match.episode} (confidence ${t.signature_match.confidence})</span>`:''}
   ${tm?`<b>trajectory match</b><span>episode ${tm.episode} (dist ${tm.distance}) - ~${tm.remaining_rows_estimate} rows to its peak</span>`:''}
   ${!t.reason&&!t.shape&&!eph.open_since?'<b>state</b><span class="muted">no active episode - nothing accumulating</span>':''}
  </div></div>
  ${anat?`<div class="card"><h3>Anatomy: organ surprise (origin in red)</h3>
   <div class="chart" id="c-anatomy" style="height:170px"></div></div>`:''}
  ${(hz&&hz.gated)?`<div class="card"><h3>Prognosis: failure-time distribution${hz.provisional_level?' [level provisional]':''}</h3>
   <div class="chart" id="c-horizon" style="height:120px"></div></div>`
   :(hz?`<div class="card"><h3>Prognosis</h3><p class="muted">horizon gated: ${hz.reason}</p></div>`:'')}
  ${(eph.episodes.length||eph.open_since)?`<div class="card wide"><h3>Episode history (the ledger - absorbed changes included)</h3>
   <div class="chart" id="c-episodes" style="height:110px"></div>
   <table><tr><th>state</th><th>start</th><th>end</th><th>channels</th><th>shape</th><th>peak evidence</th></tr>
   ${eph.episodes.map(e=>`<tr><td><span class="pill st-${e.state==='alarm'?'alarm':'change-not-fault'}">${e.state}</span></td>
    <td>${e.start}</td><td>${e.end||'open'}</td>
    <td>${(e.channels||[]).slice(0,4).join(', ')||(e.source||'-')}</td>
    <td>${e.shape||'-'}</td><td>${e.peak_evidence??'-'}</td></tr>`).join('')}
   </table></div>`:''}
  ${immune&&!immune.status?`<div class="card wide"><h3>Immune self-test ${immune.sick?'[SICK - rebuild triggered]':'[healthy]'}</h3>
   <div style="display:grid;grid-template-columns:1fr 200px;gap:10px">
    <div class="chart" id="c-immune" style="height:170px"></div>
    <div>${immune.rehearsal?`<div class="chart" id="c-rehearsal" style="height:140px"></div>`:''}
     <div class="kv"><b>conformance</b><span>${immune.conformance_ok}${immune.conformance_note?' - '+immune.conformance_note:''}</span>
     <b>pit</b><span>${immune.pit}</span><b>live degenerate</b><span>${immune.live_degenerate}</span></div></div>
   </div></div>`:'<div class="card"><h3>Immune self-test</h3><p class="muted">not yet run - use the Immune pass button</p></div>'}
 </div>`;
 healthChart(health.series);
 domChart(doms);
 if(typeof fam==='number')gaugeChart('c-coverage',fam,'familiarity');
 if(anat)anatomyChart(anat);
 if(hz&&hz.gated)horizonChart(hz);
 episodeTimeline(eph);
 if(immune&&!immune.status){immuneChart(immune);
  if(immune.rehearsal)gaugeChart('c-rehearsal',immune.rehearsal.detected_fraction,'rehearsal detected');}}

/* ------------------------------------------------ realtime */
let WS_ON=false,WS_TRIES=0,POLL=null;
function wsmeta(s,on){$('#wsmeta').textContent=s;$('#wsdot').classList.toggle('on',on);}
function applyFleet(data){
 const h=JSON.stringify([data.counts,data.rows.map(r=>[r.asset_key,r.state,r.evidence,r.at])]);
 const changed=h!==HASH;HASH=h;FLEET=data;
 if(changed){render();fetchSparks();if(SEL)detail(SEL,false);}}
async function fetchSparks(){
 const top=FLEET.rows.slice(0,30);
 await Promise.all(top.map(async v=>{
  try{HEALTH[v.asset_key]=(await jget('/api/health/'+esc(v.asset_key))).series;}catch(e){}}));
 render();}
function connect(){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/ws');
 ws.onopen=()=>{WS_ON=true;WS_TRIES=0;wsmeta('live',true);actBackfill();
  if(POLL){clearInterval(POLL);POLL=null;}
  ws.__ka=setInterval(()=>{try{ws.send('ka');}catch(e){}},25000);};
 ws.onmessage=(m)=>{try{const d=JSON.parse(m.data);
  if(d.type==='fleet')applyFleet(d.data);
  if(d.type==='activity')actAppend(d.data);}catch(e){}};
 ws.onclose=()=>{WS_ON=false;clearInterval(ws.__ka);
  wsmeta('reconnecting',false);
  if(!POLL)POLL=setInterval(refresh,6000);   // polling fallback
  setTimeout(connect,Math.min(15000,1000*Math.pow(2,WS_TRIES++)));};
 ws.onerror=()=>ws.close();}
async function refresh(){try{applyFleet(await jget('/api/assets'));}catch(e){}}

/* ------------------------------------------------ activity stream */
let ACT_N=0;
function actAppend(ev){
 const log=$('#act-log');if(!log)return;
 const atEnd=log.scrollHeight-log.scrollTop-log.clientHeight<40;
 const line=document.createElement('div');
 const t=(ev.at||'').replace('T',' ').replace(/\+.*$/,'');
 line.innerHTML=`<span class="t">${t.slice(11)}</span> `+
  `<span class="k k-${ev.kind}">${ev.kind}</span> `+
  `<span class="a">${ev.asset_key}</span> ${ev.msg}`;
 log.appendChild(line);
 while(log.children.length>500)log.removeChild(log.firstChild);
 ACT_N++;$('#act-count').textContent=`(${ACT_N} events)`;
 if(atEnd)log.scrollTop=log.scrollHeight;   // follow unless user scrolled up
}
async function actBackfill(){
 try{const d=await jget('/api/activity');
  $('#act-log').innerHTML='';ACT_N=0;
  d.events.forEach(actAppend);}catch(e){}}
actBackfill();
$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});
refresh().then(fetchSparks);
connect();
</script></body></html>
