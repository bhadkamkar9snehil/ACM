<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ACM</title>
<script src="/vendor/echarts.min.js"></script>
<style>
:root{
 --bg:#0c1116;--bg2:#121a22;--bg3:#182230;--line:#223041;--txt:#dbe4ee;
 --mut:#7d8ea1;--ok:#37b26c;--warn:#d8b636;--bad:#e05252;--chg:#d88a36;
 --ins:#5b6b7d;--acc:#4aa3df;
 /* chart palette - read by JS at render time so theme switches restyle
    every chart without a reload */
 --ch-text:#dbe4ee;--ch-axis:#7d8ea1;--ch-grid:#223041;--ch-border:#0c1116;
 --shadow:none;}
:root[data-theme="light"]{
 --bg:#f4f6f9;--bg2:#ffffff;--bg3:#e9edf3;--line:#d5dce6;--txt:#1d2733;
 --mut:#66788c;--ok:#1e8a50;--warn:#a8830a;--bad:#c73535;--chg:#b06a1a;
 --ins:#8494a8;--acc:#2277bb;
 --ch-text:#1d2733;--ch-axis:#66788c;--ch-grid:#dfe5ec;--ch-border:#ffffff;
 --shadow:0 1px 3px rgba(29,39,51,0.08);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 Consolas,Menlo,monospace;background:var(--bg);color:var(--txt);
 display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden}

/* ---------------------------------------------------- sidebar */
#nav{background:var(--bg2);border-right:1px solid var(--line);display:flex;
 flex-direction:column;padding:18px 0 14px}
#nav .brand{font-size:20px;font-weight:bold;letter-spacing:3px;padding:0 22px 4px}
#nav .brand small{display:block;font-size:10px;color:var(--mut);letter-spacing:1px;
 font-weight:normal}
#nav .navsec{margin-top:22px;flex:1}
#nav a{display:flex;align-items:center;gap:10px;padding:11px 22px;color:var(--mut);
 text-decoration:none;font-size:13.5px;border-left:3px solid transparent;cursor:pointer}
#nav a:hover{color:var(--txt);background:var(--bg3)}
#nav a.on{color:var(--txt);border-left-color:var(--acc);background:var(--bg3);font-weight:bold}
#nav a .badge{margin-left:auto;font-size:10.5px;padding:0 7px;border-radius:8px;
 background:var(--bad);color:#fff;font-weight:bold}
#nav .foot{padding:0 22px;display:flex;flex-direction:column;gap:8px}
#nav .foot .meta{color:var(--mut);font-size:11px;line-height:1.6}

/* ---------------------------------------------------- main column */
#main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0}
#topbar{display:flex;align-items:center;gap:16px;padding:12px 26px;
 background:var(--bg2);border-bottom:1px solid var(--line)}
#topbar h1{font-size:16px;letter-spacing:1px;text-transform:capitalize}
#topbar .meta{color:var(--mut);font-size:12.5px}
#topbar .spacer{flex:1}
#wsdot{width:9px;height:9px;border-radius:50%;background:var(--ins);display:inline-block}
#wsdot.on{background:var(--ok)}
button{font:inherit;font-size:12px;color:var(--txt);background:var(--bg3);
 border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.danger:hover{border-color:var(--bad)}
button:disabled{opacity:.4;cursor:wait}

.page{display:none;min-height:0;overflow-y:auto}
.page.on{display:block}
.page.grid{display:none}
.page.grid.on{display:grid}

/* ---------------------------------------------------- shared bits */
.pill{display:inline-block;padding:1px 9px;border-radius:9px;font-size:11px;
 border:1px solid var(--line);background:var(--bg3);cursor:pointer;white-space:nowrap}
.pill.on{outline:1px solid var(--acc)}
.st-healthy{background:#12331f;color:#7fe0a8;border-color:#1d4d30}
.st-watch{background:#33300f;color:#e6d87a;border-color:#4d491d}
.st-alarm{background:#3a1414;color:#f09a9a;border-color:#5c2020}
.st-escalating{background:#3a1414;color:#f09a9a;border-color:#5c2020;font-weight:bold}
.st-change-not-fault{background:#33230f;color:#e6b87a;border-color:#4d3a1d}
.st-insufficient-history{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
.st-bootstrapping{background:#14283a;color:#7ab8f0;border-color:#20405c}
.st-onboarding{background:#1e1a33;color:#a99bf0;border-color:#332c56}
.st-queued{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
:root[data-theme="light"] .st-healthy{background:#dff3e7;color:#156a3d;border-color:#a9dfc2}
:root[data-theme="light"] .st-watch{background:#faf3d3;color:#7a6207;border-color:#e8d78a}
:root[data-theme="light"] .st-alarm{background:#fbe3e3;color:#a02525;border-color:#f0b3b3}
:root[data-theme="light"] .st-escalating{background:#fbe3e3;color:#a02525;border-color:#f0b3b3;font-weight:bold}
:root[data-theme="light"] .st-change-not-fault{background:#f8ead8;color:#8a5310;border-color:#eccb9d}
:root[data-theme="light"] .st-insufficient-history{background:#e9edf3;color:#5a6c80;border-color:#cfd8e2}
:root[data-theme="light"] .st-bootstrapping{background:#ddebfa;color:#1b5e9e;border-color:#a9cdef}
:root[data-theme="light"] .st-onboarding{background:#e8e3f8;color:#4f3ba8;border-color:#c8bdec}
:root[data-theme="light"] .st-queued{background:#e9edf3;color:#5a6c80;border-color:#cfd8e2}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
 padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:11px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;
 margin-bottom:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
 font-size:12.5px;line-height:1.65}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
td,th{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:normal;font-size:11px;letter-spacing:1px;
 text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:12.5px}
.kv b{color:var(--mut);font-weight:normal}
.kv span,td,th{overflow-wrap:anywhere;word-break:break-word}
.muted{color:var(--mut)}
.chart{width:100%}

/* ---------------------------------------------------- fleet page */
#page-fleet{padding:20px 26px 28px}
#kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;
 margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
 padding:12px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mut);
 text-transform:uppercase;margin-bottom:3px;font-weight:normal}
.kpi span{font-size:23px;font-weight:bold;line-height:1.25}
.kpi small{color:var(--mut);font-size:11px;margin-left:6px}
.kpi.bad span{color:var(--bad)}.kpi.warn span{color:var(--warn)}
.kpi.ok span{color:var(--ok)}.kpi.acc span{color:var(--acc)}
#fcharts{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;margin-bottom:16px}
#fcharts .dchart{height:280px;background:var(--bg2);border:1px solid var(--line);
 border-radius:8px;box-shadow:var(--shadow)}
#fcharts2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px}
#fcharts2 .dchart{height:250px;background:var(--bg2);border:1px solid var(--line);
 border-radius:8px;box-shadow:var(--shadow)}
#ftable tr{cursor:pointer}
#ftable tbody tr:hover{background:var(--bg3)}

/* ---------------------------------------------------- assets page */
#page-assets{grid-template-columns:340px minmax(0,1fr)}
#lcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#lbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;
 flex-direction:column;gap:9px}
#lbar input{font:inherit;font-size:12.5px;background:var(--bg3);color:var(--txt);
 border:1px solid var(--line);border-radius:6px;padding:6px 12px;width:100%}
#pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#list{flex:1;overflow-y:auto;min-height:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:12px 16px;
 border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--bg3);border-left-color:var(--acc)}
.row .key{font-weight:bold;font-size:14px;overflow:hidden;text-overflow:ellipsis;
 align-self:center}
.row .sub{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;
 gap:10px;color:var(--mut);font-size:11px;align-items:center}
.evbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:60px}
.evbar i{display:block;height:100%;background:var(--acc)}
.row canvas{grid-column:1/3;width:100%;height:24px}
#detail{overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column}
#dhead{padding:18px 26px 0}
#dhead .drow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#dhead h2{font-size:20px;letter-spacing:0.5px}
#dtabs{display:flex;gap:2px;padding:0 26px;border-bottom:1px solid var(--line)}
#dtabs a{padding:9px 18px;font-size:12.5px;color:var(--mut);cursor:pointer;
 border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:1px}
#dtabs a:hover{color:var(--txt)}
#dtabs a.on{color:var(--txt);border-bottom-color:var(--acc);font-weight:bold}
.pane{display:none;padding:20px 26px 28px}
.pane.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px}
.card.wide{grid-column:1/-1}

/* ---------------------------------------------------- activity page */
#page-activity{display:none;grid-template-rows:auto minmax(0,1fr)}
#page-activity.on{display:grid}
#actbar{display:flex;gap:8px;align-items:center;padding:12px 26px;
 border-bottom:1px solid var(--line);flex-wrap:wrap}
#actbar .dotlive{width:8px;height:8px;border-radius:50%;background:#37b26c;
 animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
#act-log{overflow-y:auto;padding:12px 26px;font-size:12.5px;line-height:1.9}
#act-log .k{display:inline-block;min-width:72px;font-weight:bold}
#act-log .k-onboard{color:#a99bf0}#act-log .k-train{color:#8a76e0}
#act-log .k-bootstrap{color:#7ab8f0}#act-log .k-tick{color:#7fe0a8}
#act-log .k-service{color:#e6d87a}
#act-log .t{color:var(--mut)}#act-log .a{color:var(--txt);font-weight:bold}
:root[data-theme="light"] #act-log .k-onboard{color:#5a44c0}
:root[data-theme="light"] #act-log .k-train{color:#6a54cc}
:root[data-theme="light"] #act-log .k-bootstrap{color:#1b5e9e}
:root[data-theme="light"] #act-log .k-tick{color:#156a3d}
:root[data-theme="light"] #act-log .k-service{color:#7a6207}

/* ---------------------------------------------------- responsive */
@media (max-width:1100px){
 body{grid-template-columns:64px minmax(0,1fr)}
 #nav .brand{padding:0 8px;font-size:14px;text-align:center}
 #nav .brand small,#nav a .lbl,#nav .foot .meta{display:none}
 #nav a{justify-content:center;padding:12px 0}
 #fcharts{grid-template-columns:1fr}
 #page-assets{grid-template-columns:280px minmax(0,1fr)}}
@media (max-width:800px){
 body{display:block;overflow:auto}
 #nav{flex-direction:row;align-items:center;padding:8px 12px;border-right:none;
  border-bottom:1px solid var(--line)}
 #nav .navsec{display:flex;margin:0;flex:1}
 #nav a{border-left:none;border-bottom:2px solid transparent}
 #nav a.on{border-bottom-color:var(--acc)}
 #page-assets{display:block}
 #lcol{border-right:none;border-bottom:1px solid var(--line);max-height:40vh}
 .cards{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:9}
#toast div{background:var(--bg3);border:1px solid var(--acc);border-radius:4px;
 padding:8px 14px;font-size:12px;animation:fade 4s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
</style></head><body>

<nav id="nav">
 <div class="brand">ACM<small>asset condition monitor</small></div>
 <div class="navsec">
  <a data-p="fleet" onclick="location.hash='#/fleet'"><span>&#9632;</span><span class="lbl">Fleet</span><span class="badge" id="nb-alarm" style="display:none"></span></a>
  <a data-p="assets" onclick="location.hash='#/assets'"><span>&#9639;</span><span class="lbl">Assets</span></a>
  <a data-p="activity" onclick="location.hash='#/activity'"><span>&#9655;</span><span class="lbl">Activity</span></a>
 </div>
 <div class="foot">
  <span class="meta" id="nav-meta"></span>
  <button onclick="toggleTheme()" title="toggle light/dark theme">theme</button>
  <button onclick="window.open('/api/report','_blank')">Report</button>
 </div>
</nav>

<div id="main">
 <div id="topbar">
  <h1 id="pgtitle">fleet</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span id="wsdot" title="live stream"></span><span class="meta" id="wsmeta">connecting</span>
  <span class="meta" id="immune-meta"></span>
  <button onclick="act('tick','', 'Scoring all assets')">Tick all</button>
 </div>

 <div id="page-fleet" class="page">
  <div id="kpis"></div>
  <div id="fcharts">
   <div class="dchart" id="d-states"></div>
   <div class="dchart" id="d-evidence"></div>
  </div>
  <div id="fcharts2">
   <div class="dchart" id="d-scatter"></div>
  </div>
  <div class="card" style="padding:0">
   <table id="ftable">
    <thead><tr><th style="width:26%">asset</th><th style="width:14%">state</th>
     <th style="width:12%">evidence</th><th style="width:12%">confidence</th>
     <th>last verdict</th><th style="width:16%">trend</th></tr></thead>
    <tbody></tbody>
   </table>
  </div>
 </div>

 <div id="page-assets" class="page grid">
  <div id="lcol">
   <div id="lbar">
    <input id="q" placeholder="filter assets... ( / )">
    <span id="pills"></span>
   </div>
   <div id="list"></div>
  </div>
  <div id="detail"><p class="muted" style="padding:30px">Select an asset.</p></div>
 </div>

 <div id="page-activity" class="page">
  <div id="actbar">
   <span class="dotlive"></span><b style="font-size:12px;letter-spacing:1px">LIVE STREAM</b>
   <span class="muted" id="act-count"></span>
   <span style="flex:1"></span>
   <span id="act-pills"></span>
  </div>
  <div id="act-log"></div>
 </div>
</div>
<div id="toast"></div>

<script>
"use strict";
let FLEET=null, SEL=null, FILTER=null, HEALTH={}, HASH='', DETAIL_AT='';
let PAGE='fleet', DTAB='overview', DDATA=null;
const $=(s)=>document.querySelector(s);
const esc=encodeURIComponent;
const SC={healthy:'#37b26c',watch:'#d8b636',alarm:'#e05252',escalating:'#ff6b6b',
 'change-not-fault':'#d88a36','insufficient-history':'#5b6b7d',
 bootstrapping:'#4a90d9',onboarding:'#8a76e0',queued:'#5b6b7d'};
const PENDING=['bootstrapping','onboarding','queued'];
const CHARTS={};
let CH={};
function reTheme(){
 const cs=getComputedStyle(document.documentElement);
 CH={text:cs.getPropertyValue('--ch-text').trim(),
  axis:cs.getPropertyValue('--ch-axis').trim(),
  grid:cs.getPropertyValue('--ch-grid').trim(),
  border:cs.getPropertyValue('--ch-border').trim()};
 BASE.textStyle.color=CH.text;}
const BASE={backgroundColor:'transparent',textStyle:{color:CH.text,fontFamily:'Consolas,Menlo,monospace'},
 animationDuration:250,animationDurationUpdate:250};
if(localStorage.getItem('acm-theme')==='light')
 document.documentElement.dataset.theme='light';
reTheme();
function toggleTheme(){
 const light=document.documentElement.dataset.theme!=='light';
 document.documentElement.dataset.theme=light?'light':'';
 localStorage.setItem('acm-theme',light?'light':'dark');
 reTheme();
 renderPage();
 if(PAGE==='assets'&&SEL)detail(SEL,true);}
function ec(id,opt){
 const el=document.getElementById(id);if(!el||el.offsetParent===null&&el.clientWidth===0)return null;
 let c=CHARTS[id];
 if(!c||c.getDom()!==el){if(c)c.dispose();c=CHARTS[id]=echarts.init(el,null,{renderer:'canvas'});}
 c.setOption(Object.assign({},BASE,opt),{replaceMerge:['series','xAxis','yAxis']});
 return c;}
addEventListener('resize',()=>Object.values(CHARTS).forEach(c=>c.resize()));
function stale(at){
 if(!at)return '';
 const t=Date.parse(String(at).replace(' ','T'));
 if(isNaN(t))return '';
 const h=(Date.now()-t)/3.6e6;
 return h>48?` <span style="color:var(--warn)">(stale ${Math.round(h)}h - asset clock may lag wall clock)</span>`:'';}
function toast(m){const d=document.createElement('div');d.textContent=m;
 $('#toast').appendChild(d);setTimeout(()=>d.remove(),4200);}
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json();}
async function act(kind,key,msg){
 toast(msg+'...');
 const url=kind==='tick'&&!key?'/api/tick':`/api/${kind}/${esc(key)}`;
 try{const r=await fetch(url,{method:'POST'});const d=await r.json();
  toast(msg+': done '+JSON.stringify(d).slice(0,90));
  if(!WS_ON)await refresh();if(PAGE==='assets'&&SEL)await detail(SEL,true);}
 catch(e){toast('FAILED: '+e.message);}}
function spark(cv,data,h){
 const w=cv.width=cv.clientWidth*2,hh=cv.height=h*2,c=cv.getContext('2d');
 c.clearRect(0,0,w,hh);if(!data||data.length<2)return;
 const mn=Math.min(...data),mx=Math.max(...data),sp=(mx-mn)||1;
 c.beginPath();c.strokeStyle='#4aa3df';c.lineWidth=2;
 data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=hh-4-((v-mn)/sp)*(hh-8);
  i?c.lineTo(x,y):c.moveTo(x,y);});
 c.stroke();}

/* ------------------------------------------------ routing */
function route(){
 const h=(location.hash||'#/fleet').replace(/^#\/?/,'');
 const parts=h.split('/');
 const page=['fleet','assets','activity'].includes(parts[0])?parts[0]:'fleet';
 PAGE=page;
 if(page==='assets'&&parts.length>1)
  SEL=decodeURIComponent(parts.slice(1).join('/'));
 document.querySelectorAll('.page').forEach(p=>
  p.classList.toggle('on',p.id==='page-'+PAGE));
 document.querySelectorAll('#nav a').forEach(a=>
  a.classList.toggle('on',a.dataset.p===PAGE));
 $('#pgtitle').textContent=PAGE;
 requestAnimationFrame(()=>{
  renderPage();
  if(PAGE==='assets'&&SEL)detail(SEL,true);
  if(PAGE==='activity'){const l=$('#act-log');l.scrollTop=l.scrollHeight;}});}
addEventListener('hashchange',route);
function select(k){location.hash='#/assets/'+k;}

/* ------------------------------------------------ fleet page */
function dashboard(){
 const counts=FLEET.counts,rows=FLEET.rows;
 ec('d-states',{title:{text:'fleet states',left:10,top:8,textStyle:{fontSize:11,color:CH.axis}},
  tooltip:{trigger:'item'},
  legend:{bottom:8,left:'center',textStyle:{color:CH.axis,fontSize:11},
   itemWidth:10,itemHeight:10,icon:'circle'},
  graphic:Object.keys(counts).length?[{type:'text',left:'center',top:'44%',
   style:{text:String(FLEET.assets),fill:CH.text,fontSize:34,fontWeight:'bold',
    fontFamily:'Consolas,Menlo,monospace',align:'center'}},
   {type:'text',left:'center',top:'56%',
   style:{text:'assets',fill:CH.axis,fontSize:11,
    fontFamily:'Consolas,Menlo,monospace',align:'center'}}]
   :[{type:'text',left:'center',top:'middle',
   style:{text:'no assets yet',fill:'#5b6b7d',fontSize:12,fontFamily:'Consolas,Menlo,monospace'}}],
  series:[{type:'pie',radius:['48%','70%'],center:['50%','50%'],
   label:{show:false},emphasis:{label:{show:false}},
   itemStyle:{borderColor:CH.border,borderWidth:2},
   data:Object.entries(counts).map(([s,n])=>({name:s,value:n,itemStyle:{color:SC[s]||'#888'}}))}]});
 const top=rows.slice(0,14);
 ec('d-evidence',{title:{text:'evidence - worst first (alarm at 1.0)',left:10,top:8,textStyle:{fontSize:11,color:CH.axis}},
  grid:{left:10,right:56,top:34,bottom:10,containLabel:true},
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
  xAxis:{type:'value',axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'category',inverse:true,data:top.map(r=>r.asset_key),
   axisLabel:{color:CH.text,fontSize:11,width:130,overflow:'truncate'}},
  series:[{type:'bar',data:top.map(r=>({value:r.evidence,itemStyle:{color:SC[r.state]||'#888',borderRadius:[0,3,3,0]}})),
   label:{show:true,position:'right',color:CH.axis,fontSize:10,
    formatter:p=>p.value>=0.005?p.value.toFixed(2):''},
   markLine:{symbol:'none',lineStyle:{color:'#e05252',type:'dashed'},
    label:{color:'#e05252',formatter:'alarm'},data:[{xAxis:1}]},
   barMaxWidth:14}]});
 const sc=ec('d-scatter',{title:{text:'confidence vs evidence (click a dot to open the asset)',left:10,top:8,textStyle:{fontSize:11,color:CH.axis}},
  grid:{left:10,right:24,top:34,bottom:10,containLabel:true},
  tooltip:{formatter:p=>`${p.data[3]}<br>evidence ${p.data[1]} | confidence ${p.data[0]}`},
  xAxis:{type:'value',name:'confidence',nameTextStyle:{color:CH.axis,fontSize:10},min:0,max:1,
   axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  yAxis:{type:'log',min:0.01,axisLabel:{color:CH.axis,fontSize:10},splitLine:{lineStyle:{color:CH.grid}}},
  series:[{type:'scatter',symbolSize:d=>10+Math.min(16,d[1]*2),
   data:rows.map(r=>[r.confidence,Math.max(0.01,r.evidence),r.state,r.asset_key]),

/* ------------------------------------------------ realtime */
let WS_ON=false,WS_TRIES=0,POLL=null;
function wsmeta(s,on){$('#wsmeta').textContent=s;$('#wsdot').classList.toggle('on',on);}
function applyFleet(data){
 const h=JSON.stringify([data.counts,data.rows.map(r=>[r.asset_key,r.state,r.evidence,r.at])]);
 const changed=h!==HASH;HASH=h;FLEET=data;
 if(changed){renderPage();fetchSparks();
  if(PAGE==='assets'&&SEL)detail(SEL,false);}}
async function fetchSparks(){
 const top=FLEET.rows.slice(0,30);
 await Promise.all(top.map(async v=>{
  try{HEALTH[v.asset_key]=(await jget('/api/health/'+esc(v.asset_key))).series;}catch(e){}}));
 renderPage();}
function connect(){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/ws');
 ws.onopen=()=>{WS_ON=true;WS_TRIES=0;wsmeta('live',true);actBackfill();
  if(POLL){clearInterval(POLL);POLL=null;}
  ws.__ka=setInterval(()=>{try{ws.send('ka');}catch(e){}},25000);};
 ws.onmessage=(m)=>{try{const d=JSON.parse(m.data);
  if(d.type==='fleet')applyFleet(d.data);
  if(d.type==='activity')actAppend(d.data);}catch(e){}};
 ws.onclose=()=>{WS_ON=false;clearInterval(ws.__ka);
  wsmeta('reconnecting',false);
  if(!POLL)POLL=setInterval(refresh,6000);   // polling fallback
  setTimeout(connect,Math.min(15000,1000*Math.pow(2,WS_TRIES++)));};
 ws.onerror=()=>ws.close();}
async function refresh(){try{applyFleet(await jget('/api/assets'));}catch(e){}}

function actLine(ev){
 const t=(ev.at||'').replace('T',' ').replace(/\+.*$/,'');
 return `<div><span class="t">${t.slice(11)}</span> `+
  `<span class="k k-${ev.kind}">${ev.kind}</span> `+
  `<span class="a">${ev.asset_key}</span> ${ev.msg}</div>`;}
function actRender(){
 actPills();
 const log=$('#act-log');
 const evs=ACT_FILTER?ACT_EVENTS.filter(e=>e.kind===ACT_FILTER):ACT_EVENTS;
 log.innerHTML=evs.map(actLine).join('');
 $('#act-count').textContent=`${ACT_EVENTS.length} events`;
 log.scrollTop=log.scrollHeight;}
function actAppend(ev){
 ACT_EVENTS.push(ev);
 if(ACT_EVENTS.length>500)ACT_EVENTS.shift();
 $('#act-count').textContent=`${ACT_EVENTS.length} events`;
 if(ACT_FILTER&&ev.kind!==ACT_FILTER)return;
 const log=$('#act-log');
 const atEnd=log.scrollHeight-log.scrollTop-log.clientHeight<40;
 log.insertAdjacentHTML('beforeend',actLine(ev));
 while(log.children.length>500)log.removeChild(log.firstChild);
 if(atEnd)log.scrollTop=log.scrollHeight;}
async function actBackfill(){
 try{const d=await jget('/api/activity');
  ACT_EVENTS=d.events;actRender();}catch(e){}}

/* ------------------------------------------------ boot */
$('#q').addEventListener('input',renderList);
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&PAGE==='assets'&&document.activeElement!==$('#q')){
  e.preventDefault();$('#q').focus();}});
actPills();
actBackfill();
route();
refresh().then(fetchSparks);
connect();
</script></body></html>
