<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ACM</title>
<!-- All vendored, served locally, never a CDN - zero-build UI must
     work air-gapped. Licenses (verified against npm registry, not just
     file header comments - clusterize.min.js's own header comment is
     a stale leftover claiming GPLv3, but its package.json and GitHub
     LICENSE are both MIT): preact MIT, preact/hooks MIT,
     @preact/signals-core + @preact/signals MIT, htm Apache-2.0,
     marked MIT, clusterize.js MIT.
     Load order matters: preact-signals.min.js resolves preact /
     preactHooks / preactSignalsCore off the global object at UMD
     fallback time, so it must load after all three. -->
<script src="/vendor/preact.min.js"></script>
<script src="/vendor/preact-hooks.min.js"></script>
<script src="/vendor/preact-signals-core.min.js"></script>
<script src="/vendor/preact-signals.min.js"></script>
<script src="/vendor/htm.min.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/clusterize.min.js"></script>
<style>
:root{
 /* surfaces: page -> card -> raised control, each one visible step up.
    Hairlines are TRANSLUCENT so they read correctly over any surface;
    --line-strong is the emphasis variant (sticky headers, dividers
    that must survive next to charts). */
 --bg:#0a0f15;--bg2:#111a24;--bg3:#1a2532;--txt:#dde6f0;
 --line:rgba(148,170,197,.15);--line-strong:rgba(148,170,197,.28);
 --mut:#7d8ea1;--ok:#37b26c;--warn:#d8b636;--bad:#e05252;--chg:#d88a36;
 --ins:#5b6b7d;--acc:#4aa3df;
 /* rgb companions (same colors as above) for translucent hover/focus
    tints via rgba() - broad browser support, no color-mix() needed */
 --acc-rgb:74,163,223;--bad-rgb:224,82,82;--ok-rgb:55,178,108;--warn-rgb:216,182,54;
 /* chart palette - read by JS at render time so theme switches restyle
    every chart without a reload */
 --ch-text:#dde6f0;--ch-axis:#7d8ea1;--ch-grid:#1d2938;--ch-border:#0a0f15;
 /* elevation: dark surfaces get real depth too - a soft drop for lift
    plus an inset top highlight (the "lit edge" that makes a dark card
    read as raised instead of just outlined). --shadow-2 is the pop
    layer: modals, toasts, anything floating above the page. */
 --shadow:inset 0 1px 0 rgba(255,255,255,.04),
  0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.22);
 --shadow-2:inset 0 1px 0 rgba(255,255,255,.05),
  0 4px 12px rgba(0,0,0,.45),0 16px 48px rgba(0,0,0,.4);

 /* type */
 --font-mono:ui-monospace,"Cascadia Code","Cascadia Mono","Segoe UI Mono",
  "SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
 /* type scale - every font-size in this file is one of these seven,
    by role: xs = uppercase eyebrows/labels, sm = secondary/pills,
    md = dense body (tables, meta, buttons), base = body, lg = page
    titles, xl = the asset headline, num = the big KPI figures. */
 --fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;
 --fs-lg:16.5px;--fs-xl:21px;--fs-num:26px;

 /* spacing scale - every padding/margin/gap in this file is drawn from
    here by role, not hand-picked per component. Widened (2026-07) for
    breathing room: card padding, grid gaps, and page margins all pull
    from the upper end. */
 --sp-1:4px;--sp-2:6px;--sp-3:9px;--sp-4:12px;--sp-5:16px;--sp-6:20px;
 --sp-7:24px;--sp-8:28px;--sp-9:34px;--sp-10:44px;--sp-hairline:2px;

 /* corner radius scale */
 --r-tight:3px;--r-control:6px;--r-card:10px;--r-pill:999px;}
:root[data-theme="light"]{
 --bg:#edf0f4;--bg2:#ffffff;--bg3:#e4e9ef;--txt:#1d2733;
 --line:rgba(28,42,60,.14);--line-strong:rgba(28,42,60,.26);
 --mut:#66788c;--ok:#1e8a50;--warn:#a8830a;--bad:#c73535;--chg:#b06a1a;
 --ins:#8494a8;--acc:#2277bb;
 --acc-rgb:34,119,187;--bad-rgb:199,53,53;--ok-rgb:30,138,80;--warn-rgb:168,131,10;
 --ch-text:#1d2733;--ch-axis:#66788c;--ch-grid:#e2e8ef;--ch-border:#ffffff;
 /* two-layer shadow (tight contact + soft ambient) reads as real lift
    against a white card; a single low-alpha shadow was invisible next
    to the barely-tinted page background */
 --shadow:0 1px 2px rgba(20,30,45,.07),0 5px 14px rgba(20,30,45,.08);
 --shadow-2:0 4px 12px rgba(20,30,45,.14),0 18px 50px rgba(20,30,45,.18);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:var(--fs-base)/1.55 var(--font-mono);background:var(--bg);color:var(--txt);
 display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr);
 overflow:hidden;
 /* every digit column in the app lines up: verdict tables, KPI numbers,
    chip values, tick times */
 font-variant-numeric:tabular-nums;
 -webkit-font-smoothing:antialiased}
#app{display:contents}
/* one scrollbar look everywhere - the default chrome scrollbar reads
   as a foreign element on the dark theme */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px;
 border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-strong);
 border:2px solid transparent;background-clip:content-box}

/* ---------------------------------------------------- sidebar */
#nav{background:var(--bg2);border-right:1px solid var(--line);display:flex;
 flex-direction:column;padding:var(--sp-7) 0 var(--sp-5)}
#nav .brand{font-size:20px;font-weight:bold;letter-spacing:3px;
 padding:0 var(--sp-7) var(--sp-1)}
#nav .brand small{display:block;font-size:var(--fs-xs);color:var(--mut);
 letter-spacing:1px;font-weight:normal}
#nav .navsec{margin-top:var(--sp-7);flex:1}
#nav a{display:flex;align-items:center;gap:var(--sp-4);
 margin:0 var(--sp-5);padding:var(--sp-3) var(--sp-5);border-radius:var(--r-control);
 color:var(--mut);text-decoration:none;font-size:var(--fs-base);
 cursor:pointer;transition:background-color .15s ease,color .15s ease}
#nav a:hover{color:var(--txt);background:var(--bg3)}
#nav a.on{color:var(--txt);background:var(--bg3);font-weight:bold}
#nav a .badge{margin-left:auto;font-size:var(--fs-xs);padding:0 var(--sp-2);
 border-radius:var(--r-pill);background:var(--bad);color:#fff;font-weight:bold}
#nav .foot{padding:0 var(--sp-7);display:flex;flex-direction:column;gap:var(--sp-3)}
#nav .foot .meta{color:var(--mut);font-size:var(--fs-sm);line-height:1.6}

/* ---------------------------------------------------- main column */
#main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0}
#topbar{display:flex;align-items:center;gap:var(--sp-7);padding:var(--sp-4) var(--sp-7);
 background:var(--bg2);border-bottom:1px solid var(--line)}
#topbar h1{font-size:var(--fs-lg);letter-spacing:1px;text-transform:capitalize}
#topbar .meta{color:var(--mut);font-size:var(--fs-md)}
#topbar .spacer{flex:1}
#wsdot{width:8px;height:8px;border-radius:50%;background:var(--ins);display:inline-block}
#wsdot.on{background:var(--ok);box-shadow:0 0 6px rgba(var(--ok-rgb),.6)}
button{font:inherit;font-size:var(--fs-md);color:var(--txt);background:var(--bg3);
 border:1px solid var(--line-strong);border-radius:var(--r-control);
 padding:var(--sp-2) var(--sp-6);
 cursor:pointer;transition:background-color .15s ease,border-color .15s ease,
  color .15s ease,transform .06s ease}
button:hover{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.10)}
button:active{background:rgba(var(--acc-rgb),.18);transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.danger:hover{border-color:var(--bad);color:var(--bad);background:rgba(var(--bad-rgb),.10)}
button.danger:active{background:rgba(var(--bad-rgb),.18)}
button:disabled{opacity:.4;cursor:wait}
button:disabled:hover{border-color:var(--line);color:var(--txt);background:var(--bg3)}
button.primary{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.12)}
button.sm{font-size:var(--fs-sm);padding:2px var(--sp-4)}
/* form controls (#139 control console) - matched to the button system */
input,select,textarea{font:inherit;font-size:var(--fs-md);color:var(--txt);
 background:var(--bg);border:1px solid var(--line-strong);
 border-radius:var(--r-control);padding:var(--sp-2) var(--sp-5)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input::placeholder{color:var(--mut)}
label.fld{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-xs);
 letter-spacing:.5px;color:var(--mut);text-transform:uppercase}
label.fld input,label.fld select{text-transform:none;letter-spacing:0}
.frow{display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:flex-end}
.frow>label.fld{flex:1;min-width:120px}

/* Control console. Explicit 6-col spans, ordered by what an operator
   actually does: the registry (the fleet itself) is the page's subject and
   leads full-width; the two things you DO (add an asset, push data) sit
   side by side; the three read-only status panels share the last row.
   No max-width cap - a capped page leaves a dead gutter on a wide screen. */
#page-control{padding:var(--sp-6) var(--sp-7) var(--sp-7)}
#page-control.on{display:block}
#ctl-grid{display:grid;grid-template-columns:repeat(6,1fr);
 gap:var(--sp-5);align-items:start}
#ctl-grid .card{grid-column:span 6;padding:var(--sp-6)}
#ctl-grid .c-add,#ctl-grid .c-ingest{grid-column:span 3}
#ctl-grid .c-src,#ctl-grid .c-store,#ctl-grid .c-svc{grid-column:span 2}
#ctl-grid .card.wide{grid-column:1/-1}
@media(max-width:1400px){
 #ctl-grid .c-src,#ctl-grid .c-store,#ctl-grid .c-svc{grid-column:span 3}}
@media(max-width:900px){
 #ctl-grid .card{grid-column:1/-1}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3) var(--sp-7);
 font-size:var(--fs-md);line-height:1.7}
/* registry action buttons stay on one line - wrapping them doubled every
   row's height and turned an 8-asset table into a full screen of scroll */
td.acts{white-space:nowrap}
td.acts button{margin-right:var(--sp-2)}
.kv .k{color:var(--mut)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
input[type=file]{max-width:100%;font-size:var(--fs-sm)}
.src-ok{color:var(--ok)}
.src-err{color:var(--bad)}
.roflag{font-size:var(--fs-xs);color:var(--mut);border:1px dashed var(--line-strong);
 border-radius:var(--r-control);padding:1px var(--sp-3);margin-left:var(--sp-3)}

.page{display:none;min-height:0;overflow-y:auto}
.page.on{display:block}
.page.grid{display:none}
.page.grid.on{display:grid}

/* ---------------------------------------------------- shared bits */
.pill{display:inline-block;padding:1.5px var(--sp-3);border-radius:var(--r-pill);
 font-size:var(--fs-sm);line-height:1.5;
 border:1px solid var(--line-strong);background:var(--bg3);cursor:pointer;
 white-space:nowrap;transition:border-color .15s ease}
.pill:hover{border-color:var(--acc)}
.pill.on{outline:1px solid var(--acc)}
.st-healthy{background:#12331f;color:#7fe0a8;border-color:#1d4d30}
.st-watch{background:#33300f;color:#e6d87a;border-color:#4d491d}
.st-alarm{background:#3a1414;color:#f09a9a;border-color:#5c2020}
.st-escalating{background:#3a1414;color:#f09a9a;border-color:#5c2020;font-weight:bold}
.st-change-not-fault{background:#33230f;color:#e6b87a;border-color:#4d3a1d}
.st-insufficient-history{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
.st-bootstrapping{background:#14283a;color:#7ab8f0;border-color:#20405c}
.st-onboarding{background:#1e1a33;color:#a99bf0;border-color:#332c56}
.st-queued{background:#1c2530;color:#93a5b8;border-color:#2a3a4d}
:root[data-theme="light"] .st-healthy{background:#dff3e7;color:#156a3d;border-color:#a9dfc2}
:root[data-theme="light"] .st-watch{background:#faf3d3;color:#7a6207;border-color:#e8d78a}
:root[data-theme="light"] .st-alarm{background:#fbe3e3;color:#a02525;border-color:#f0b3b3}
:root[data-theme="light"] .st-escalating{background:#fbe3e3;color:#a02525;border-color:#f0b3b3;font-weight:bold}
:root[data-theme="light"] .st-change-not-fault{background:#f8ead8;color:#8a5310;border-color:#eccb9d}
:root[data-theme="light"] .st-insufficient-history{background:var(--bg3);color:#5a6c80;border-color:#cfd8e2}
:root[data-theme="light"] .st-bootstrapping{background:#ddebfa;color:#1b5e9e;border-color:#a9cdef}
:root[data-theme="light"] .st-onboarding{background:#e8e3f8;color:#4f3ba8;border-color:#c8bdec}
:root[data-theme="light"] .st-queued{background:var(--bg3);color:#5a6c80;border-color:#cfd8e2}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-card);
 padding:var(--sp-6);min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:var(--fs-xs);letter-spacing:1.5px;color:var(--mut);
 text-transform:uppercase;margin-bottom:var(--sp-4)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
 font-size:var(--fs-md);line-height:1.65}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs-md)}
td,th{text-align:left;padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:normal;font-size:var(--fs-xs);letter-spacing:1px;
 text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-1) var(--sp-7);
 font-size:var(--fs-md)}
.kv b{color:var(--mut);font-weight:normal}
.kv span,td,th{overflow-wrap:anywhere;word-break:break-word}
.muted{color:var(--mut)}
.chart{width:100%}
.cap{color:var(--mut);font-size:var(--fs-sm);line-height:1.55;margin-top:var(--sp-4);
 padding-top:var(--sp-4);border-top:1px solid var(--line)}
.cap b{color:var(--txt);font-weight:bold}

/* ---------------------------------------------------- health narrative */
.narr-lead{font-size:var(--fs-base);font-weight:bold;line-height:1.6;margin-bottom:var(--sp-6)}
.narr-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.narr-row{padding:var(--sp-2) 0;line-height:1.6;font-size:var(--fs-md)}
.narr-row b{display:block;font-size:var(--fs-xs);letter-spacing:1.5px;color:var(--mut);
 text-transform:uppercase;font-weight:normal;margin-bottom:2px}
.narr-row.narr-ok b{color:var(--ok)}
.narr-row.narr-bad b{color:var(--bad)}
.narr-falsifiable{margin-top:var(--sp-7);padding:var(--sp-4) var(--sp-5);
 border:1px dashed var(--line);border-radius:var(--r-control);font-style:italic;
 color:var(--mut);font-size:var(--fs-md);line-height:1.6}
.narr-falsifiable b{font-style:normal;color:var(--txt);font-weight:bold;
 margin-right:var(--sp-2)}

/* ---------------------------------------------------- fleet page */
/* the whole page scrolls (was a fixed-viewport flex column with only the
   table scrolling internally - which squeezed every section as content
   grew). Each band now takes its natural height and breathes. */
#page-fleet{padding:var(--sp-6) var(--sp-7) var(--sp-7)}
#page-fleet.on{display:block;overflow-y:auto}
#kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:var(--sp-5);
 margin-bottom:var(--sp-5)}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-card);
 padding:var(--sp-5) var(--sp-7);box-shadow:var(--shadow)}
.kpi b{display:block;font-size:var(--fs-xs);letter-spacing:1.5px;color:var(--mut);
 text-transform:uppercase;margin-bottom:var(--sp-2);font-weight:normal}
.kpi .row{display:flex;align-items:baseline;gap:var(--sp-3);overflow:hidden;min-width:0;
 border-bottom:none;padding:0;cursor:default}
.kpi span{font-size:var(--fs-num);font-weight:bold;line-height:1.15;
 letter-spacing:-0.5px;flex:0 0 auto;white-space:nowrap}
.kpi small{color:var(--mut);font-size:var(--fs-sm);overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kpi.bad span{color:var(--bad)}.kpi.warn span{color:var(--warn)}
.kpi.ok span{color:var(--ok)}.kpi.acc span{color:var(--acc)}
/* Deliberate hierarchy on a 6-col grid instead of equal auto-fit cells:
   the two primary triage charts (evidence bars, confidence scatter) get a
   wide 4-col box; the two reference donuts (states, alpha budget) sit beside
   them in a compact 2-col box; the diagnostic cost charts share a row 3+3;
   case history spans the full width. Collapses to a single column on narrow
   screens so nothing is ever cramped. */
#fcharts{display:grid;grid-template-columns:repeat(6,1fr);
 gap:var(--sp-5);margin-bottom:var(--sp-5);align-items:stretch}
#fcharts .card{grid-column:span 6}
#fcharts .c-evidence,#fcharts .c-scatter{grid-column:span 4}
#fcharts .c-states,#fcharts .c-budget{grid-column:span 2}
#fcharts .c-tickcost,#fcharts .c-stagecost{grid-column:span 3}
#fcharts .card.wide{grid-column:1/-1}
@media(max-width:1200px){
 #fcharts{grid-template-columns:1fr}
 #fcharts .card{grid-column:1/-1}}
#ftable-card{padding:0;display:flex;flex-direction:column}
#ftable-card h3{padding:var(--sp-6) var(--sp-6) 0;flex:0 0 auto}
#ftable-scroll{overflow-y:auto;max-height:70vh}
#ftable{margin-top:var(--sp-4)}
#ftable thead th{position:sticky;top:0;background:var(--bg2);z-index:1;border-bottom:1px solid var(--line-strong)}
#ftable td{padding:var(--sp-3) var(--sp-6)}
#ftable th{padding:var(--sp-3) var(--sp-6)}
#ftable tr{cursor:pointer;transition:background-color .15s ease}
#ftable tbody tr:nth-child(even){background:rgba(127,142,161,0.05)}
#ftable tbody tr:hover{background:var(--bg3)}

/* ---------------------------------------------------- assets page */
#page-assets{grid-template-columns:340px minmax(0,1fr)}
#lcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#lbar{padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--line);display:flex;
 flex-direction:column;gap:var(--sp-3)}
#lbar input{font:inherit;font-size:var(--fs-md);background:var(--bg3);color:var(--txt);
 border:1px solid var(--line);border-radius:var(--r-control);padding:var(--sp-2) var(--sp-5);
 width:100%;transition:border-color .15s ease}
#lbar input:focus{border-color:var(--acc);outline:2px solid rgba(var(--acc-rgb),.30);
 outline-offset:0}
#pills{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
#list{flex:1;overflow-y:auto;min-height:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-1) var(--sp-4);
 padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--line);cursor:pointer;
 transition:background-color .15s ease}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--bg3)}
.row.sel .key{color:var(--acc)}
.row .key{font-weight:bold;font-size:var(--fs-base);overflow:hidden;text-overflow:ellipsis;
 align-self:center}
.row .sub{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;
 gap:var(--sp-4);color:var(--mut);font-size:var(--fs-sm);align-items:center}
.evbar{height:6px;background:var(--bg3);border-radius:var(--r-tight);overflow:hidden;
 min-width:60px}
.evbar i{display:block;height:100%;background:var(--acc)}
.row canvas{grid-column:1/3;width:100%;height:24px}
#detail{overflow-y:auto;overflow-x:hidden;min-width:0;display:flex;flex-direction:column}
#dhead{padding:var(--sp-6) var(--sp-7) 0}
#dhead .drow{display:flex;gap:var(--sp-5);align-items:center;flex-wrap:wrap;
 margin-bottom:var(--sp-4)}
#dhead h2{font-size:var(--fs-xl);letter-spacing:0.5px}
.schips{display:flex;gap:var(--sp-8);align-items:center;flex-wrap:wrap;
 margin-bottom:var(--sp-5)}
.schip{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-md)}
.schip b{font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:var(--mut);
 font-weight:normal}
.schip .sval{font-weight:bold;font-size:var(--fs-base);color:var(--txt);
 font-variant-numeric:tabular-nums}
.sbar{width:64px;height:7px;background:var(--bg3);border-radius:var(--r-tight);
 overflow:hidden;border:1px solid var(--line)}
.sbar i{display:block;height:100%}
#dtabs{display:flex;gap:var(--sp-hairline);padding:0 var(--sp-7);
 border-bottom:1px solid var(--line)}
#dtabs a{padding:var(--sp-3) var(--sp-6);font-size:var(--fs-md);color:var(--mut);cursor:pointer;
 border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:1px;
 transition:color .15s ease,border-color .15s ease}
#dtabs a:hover{color:var(--txt)}
#dtabs a.on{color:var(--txt);border-bottom-color:var(--acc);font-weight:bold}
.pane{display:none;padding:var(--sp-6) var(--sp-7) var(--sp-7)}
.pane.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:var(--sp-5);
 align-items:start}
.card.wide{grid-column:1/-1}

/* ---------------------------------------------------- activity page */

<script>
"use strict";
/* ==================================================================
   Rendering architecture: Preact (vdom/components) + htm (JSX-like
   tagged-template syntax, no build step - the whole reason this pair
   works for a zero-build, air-gapped-servable single file) +
   @preact/signals for global reactive state. Replaces the previous
   generation's string-template + morphdom-patch architecture: every
   render function used to build an HTML string and hand it to
   morphdom for in-place diffing, with a hand-rolled onBeforeElUpdated
   guard to stop chart containers from being torn down. Preact's own
   vdom diffing does that correctly by construction (a chart's DOM
   node is a component-owned ref, never regenerated by re-render), so
   morphdom is no longer part of this file - the EChart component
   below is the direct replacement for that whole mechanism.
   ================================================================== */
const {h,render,Fragment,createRef}=preact;
const {useState,useEffect,useRef,useMemo}=preactHooks;
const {signal,effect}=preactSignalsCore;
const html=htm.bind(h);

/* ------------------------------------------------ small helpers */
const $=(s)=>document.querySelector(s);
// encodeURIComponent deliberately leaves ' ( ) ~ * ! unescaped (they're
// valid in a URL path segment). %27 is inert either way; kept for
// parity with the backend's {asset_key:path} route converter, which
// accepts both literal and percent-encoded slashes.
const esc=(s)=>encodeURIComponent(s).replace(/'/g,'%27');
// Preact auto-escapes every text child and attribute value that comes
// from a JS expression (htm never concatenates raw strings into HTML
// the way the old template-string renderer did), so escHtml() is no
// longer needed for ordinary UI text - it survives only for the
// Report modal, which parses server markdown through marked.js and
// injects the result via dangerouslySetInnerHTML (the one remaining
// raw-HTML sink in this file). render_report() (monitor.py) embeds
// asset_key straight into the markdown table text, and marked, like
// any CommonMark parser, passes raw inline HTML in its source straight
// through by default - escaping the whole markdown source before
// parsing neutralizes any literal HTML while leaving markdown syntax
// (# | * - `) completely untouched (none of it uses & < > " ').
const escHtml=(s)=>String(s??'').replace(/[&<>"']/g,c=>
 ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF_INT=new Intl.NumberFormat();
const NF_DEC=new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=(n)=>typeof n==='number'&&isFinite(n)?NF_INT.format(n):(n??'-');
const fmtDec=(n)=>typeof n==='number'&&isFinite(n)?NF_DEC.format(n):(n??'-');
const SC={healthy:'#37b26c',watch:'#d8b636',alarm:'#e05252',escalating:'#ff6b6b',
 'change-not-fault':'#d88a36','insufficient-history':'#5b6b7d',
 bootstrapping:'#4a90d9',onboarding:'#8a76e0',queued:'#5b6b7d'};
const PENDING=['bootstrapping','onboarding','queued'];
// one color per evidence domain, used identically by the budget donut,
// the evidence-history lines, and anything else that names a domain -
// a domain must look the same everywhere it appears
const DOMAIN_COLORS={
 'magnitude':'#4aa3df','channel-local':'#8a76e0','availability':'#5b6b7d',
 'horizon-gap':'#37b26c','predictability-band':'#d8b636',
 'transient-response':'#d88a36','dynamics-drift':'#e05252'};
function stale(at){
 if(!at)return '';
 const t=Date.parse(String(at).replace(' ','T'));
 if(isNaN(t))return '';
 const hh=(Date.now()-t)/3.6e6;
 return hh>48?` (stale ${Math.round(hh)}h - asset clock may lag wall clock)`:'';}
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json();}
async function jpost(u,body){const r=await fetch(u,{method:'POST',
 headers:body!==undefined?{'content-type':'application/json'}:{},
 body:body!==undefined?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||(u+' '+r.status));return d;}
async function jdel(u){const r=await fetch(u,{method:'DELETE'});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||(u+' '+r.status));return d;}
async function jpostText(u,text,ctype){const r=await fetch(u,{method:'POST',
 headers:{'content-type':ctype||'text/plain'},body:text});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||(u+' '+r.status));return d;}

/* ------------------------------------------------ global reactive store
   Every piece of state that more than one component reads lives in a
   signal here. A plain functional component that reads `S.x.value`
   directly in its render body is auto-subscribed by @preact/signals
   (it patches Preact's rendering hooks for exactly this) - no
   useState/useEffect ceremony needed to keep components in sync with
   a WebSocket push or another component's action. */
const S={
 fleet:signal(null),
 sel:signal(null),
 filter:signal(localStorage.getItem('acm-filter')||null),
 query:signal(localStorage.getItem('acm-query')||''),
 page:signal('fleet'),
 dtab:signal('overview'),
 health:signal({}),
 actEvents:signal([]),
 actFilter:signal(null),
 wsOn:signal(false),
 wsLabel:signal('connecting'),
 sortCol:signal(null),
 sortDir:signal(1),

 reportOpen:signal(false),
 reportHtml:signal(''),
 reportErr:signal(''),
 ddata:signal(null),
 fleetHash:signal(''),
 cost:signal(null),
 cases:signal(null),
 stageCost:signal(null),
 registry:signal(null),
 storage:signal(null),
 svcInfo:signal(null),
 sources:signal(null),
};
let toastId=0;
function toast(m){
 const id=++toastId;
 S.toasts.value=[...S.toasts.value,{id,m}];
 setTimeout(()=>{S.toasts.value=S.toasts.value.filter(t=>t.id!==id);},4200);}

/* ------------------------------------------------ theme
   CH mirrors the CSS chart-palette custom properties as a plain
   object every chart option builder reads - kept outside signals
   (charts re-read it imperatively inside the EChart component,
   not via component re-render) since it only changes on an explicit
   theme toggle, not on a hot path. */
let CH={};
function reTheme(){
 const cs=getComputedStyle(document.documentElement);
 CH={text:cs.getPropertyValue('--ch-text').trim(),
  axis:cs.getPropertyValue('--ch-axis').trim(),
  grid:cs.getPropertyValue('--ch-grid').trim(),
  border:cs.getPropertyValue('--ch-border').trim()};}
if(localStorage.getItem('acm-theme')==='light')document.documentElement.dataset.theme='light';
reTheme();
const themeTick=signal(0);   // bumped on toggle so EChart-consuming components re-render with fresh CH
function toggleTheme(){
 const light=document.documentElement.dataset.theme!=='light';
 document.documentElement.dataset.theme=light?'light':'';
 localStorage.setItem('acm-theme',light?'light':'dark');
 reTheme();
 themeTick.value++;}
function baseOpt(){
 return {backgroundColor:'transparent',
  textStyle:{color:CH.text,fontFamily:'Consolas,Menlo,monospace'},
  animationDuration:250,animationDurationUpdate:250};}

/* ------------------------------------------------ EChart component
   The direct replacement for the old global CHARTS{} map + ec()
   function + morphdom keepCharts guard: each chart owns its own DOM
   node via a ref, created once on mount and disposed on unmount.
   Re-renders just call setOption - Preact never touches the chart's
   subtree because the div is a leaf with no vdom children. */
function EChart({id,height,option,onReady}){
 const ref=useRef(null);
 const inst=useRef(null);
 useEffect(()=>{
  if(!ref.current)return;
  const c=echarts.init(ref.current,null,{renderer:'canvas'});
  inst.current=c;
  if(onReady)onReady(c);
  const onResize=()=>c.resize();
  addEventListener('resize',onResize);
  return ()=>{removeEventListener('resize',onResize);c.dispose();inst.current=null;};
 },[]);
 useEffect(()=>{
  if(inst.current&&option)
   inst.current.setOption(Object.assign({},baseOpt(),option),{replaceMerge:['series','xAxis','yAxis']});
 });
 const style=height?`height:${height}px`:'';
 return html`<div class="chart" id=${id} style=${style} ref=${ref}></div>`;}

/* ------------------------------------------------ Sparkline canvas */
function spark(cv,data,hh){
 const w=cv.width=cv.clientWidth*2,H=cv.height=hh*2,c=cv.getContext('2d');
 c.clearRect(0,0,w,H);if(!data||data.length<2)return;
 const mn=Math.min(...data),mx=Math.max(...data),sp=(mx-mn)||1;
 c.beginPath();c.strokeStyle='#4aa3df';c.lineWidth=2;
 data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=H-4-((v-mn)/sp)*(H-8);
  i?c.lineTo(x,y):c.moveTo(x,y);});
 c.stroke();}
function Spark({dataKey,h:hh}){
 const ref=useRef(null);
 const series=S.health.value[dataKey];
 useEffect(()=>{
  if(ref.current&&series&&series.length>=2)spark(ref.current,series.slice(-120),hh);
 });
 // #132: an asset with no health series yet (queued/bootstrapping/
 // insufficient-history - most of a freshly-seeded fleet) previously
 // left a bare, unstyled <canvas> at browser-default size with nothing
 // drawn - it read as a rendering bug, not "no data yet".
 if(!series||series.length<2)
  return html`<span class="muted" style="font-size:10px">no data yet</span>`;
 return html`<canvas ref=${ref}></canvas>`;}

/* ------------------------------------------------ chart option builders
   Pure functions: data in, ECharts `option` object out. Kept separate
   from EChart itself so every call site just does
   html`<${EChart} option=${statesOption(...)}/>` - same shape as the

// Per-domain, per-timescale wealth - the direct answer to "what is ACM
// doing this tick" at the mechanism level. A verdict's own evidence_trail
// only ever shows block-size detail for whichever ONE domain won the
// state-priority resolution (monitor.py); /api/domains reads every
// bank's state() independently, so this is the one place all 6 domains'
// internal timescale members are visible on every tick, win or lose.
// Block sizes are each domain's OWN derived timescale (decorrelation
// length x1/x4/x16) and are not comparable across domains, so columns
// are member RANK (shortest to longest per domain), not absolute size -
// the actual block size is in the tooltip.
function domainMembersOption(doms){
 const names=Object.keys(doms||{}).filter(k=>doms[k]&&doms[k].enabled&&doms[k].members);
 if(!names.length)return null;
 let maxMembers=1,maxPos=0.01;
 const rows=names.map(n=>{
  const bsizes=Object.keys(doms[n].members).map(Number).sort((a,b)=>a-b);
  maxMembers=Math.max(maxMembers,bsizes.length);
  return bsizes.map(bs=>{
   const m=doms[n].members[String(bs)];
   maxPos=Math.max(maxPos,m.log_wealth);
   return {bs,log_wealth:m.log_wealth,alarmed:m.alarmed};});});
 if(maxMembers<1)return null;
 // A supermartingale drifts negative under health and climbs toward the
 // alarm threshold as evidence accumulates - it is NOT a symmetric
 // diverging quantity where "very negative" deserves the same visual
 // alarm as "very positive". Sequential scale instead: negative/near-
 // zero wealth (no evidence) floors at the neutral grid color, rising
 // wealth reads green->amber, and only a cell that has actually crossed
 // its own threshold (alarmed=true) is forced red via an explicit
 // itemStyle override - matching the green/amber/red-on-alarm language
 // used by every other evidence chart in this file (evidenceOption,
 // domOption). An earlier version used a diverging red<->green scale
 // that put red at the NEGATIVE end, making a perfectly healthy,
 // unalarmed bank read as if something were wrong - caught visually
 // during review, not by any test.
 const data=[];
 rows.forEach((members,ni)=>members.forEach((m,ci)=>{
  data.push({value:[ci,ni,Math.max(0,Math.round(m.log_wealth*1000)/1000)],
   raw:Math.round(m.log_wealth*1000)/1000,
   domain:names[ni],bs:m.bs,alarmed:m.alarmed,
   itemStyle:m.alarmed
    ?{color:'#e05252',borderColor:'#e05252',borderWidth:2}
    :{borderColor:CH.border,borderWidth:1}});}));
 return {grid:{left:150,right:20,top:8,bottom:30},
  tooltip:{formatter:p=>`${p.data.domain}, block=${p.data.bs}<br>log-wealth ${fmtDec(p.data.raw)}${p.data.alarmed?' - ALARMED':''}`},
  xAxis:{type:'category',data:Array.from({length:maxMembers},(_,i)=>`member ${i+1}`),
   axisLabel:{color:CH.axis,fontSize:10},splitArea:{show:true}},
  yAxis:{type:'category',data:names,axisLabel:{color:CH.text,fontSize:10,width:130,overflow:'truncate'},
   splitArea:{show:true}},

   inRange:{color:[CH.grid,'#d8b636']}},

/* ------------------------------------------------ actions
   Re-entrancy is guarded by a synchronous Set, not by the (async,
   Preact-batched) setBusy state: a component's disabled=${busy} render
   doesn't reach the DOM until the next render flush, so a fast
   double-click could otherwise slip a second request through before
   the button visually disables. This module-level lock closes that
   window regardless of render timing. */
const ACTIONS_IN_FLIGHT=new Set();
async function act(kind,key,msg,setBusy){
 const lockKey=kind+':'+(key||'');
 if(ACTIONS_IN_FLIGHT.has(lockKey))return;
 ACTIONS_IN_FLIGHT.add(lockKey);
 if(setBusy)setBusy(true);
 toast(msg+'...');
 const url=kind==='tick'&&!key?'/api/tick':`/api/${kind}/${esc(key)}`;
 try{const r=await fetch(url,{method:'POST'});const d=await r.json();
  toast(msg+': done '+JSON.stringify(d).slice(0,90));
  if(!S.wsOn.value)await refresh();
  if(S.page.value==='assets'&&S.sel.value)await loadDetail(S.sel.value,true);}
 catch(e){toast('FAILED: '+e.message);}
 finally{ACTIONS_IN_FLIGHT.delete(lockKey);if(setBusy)setBusy(false);}}

 S.fleetHash.value=hh;S.fleet.value=data;
 $('#boot').classList.add('gone');

/* ------------------------------------------------ realtime */
let POLL=null,WS_TRIES=0;
function connect(){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/ws');
 ws.onopen=()=>{S.wsOn.value=true;WS_TRIES=0;S.wsLabel.value='live';actBackfill();
  if(POLL){clearInterval(POLL);POLL=null;}
  ws.__ka=setInterval(()=>{try{ws.send('ka');}catch(e){}},25000);};
 ws.onmessage=(m)=>{try{const d=JSON.parse(m.data);
  if(d.type==='fleet')applyFleet(d.data);
  if(d.type==='activity')actAppend(d.data);}catch(e){}};
 ws.onclose=()=>{S.wsOn.value=false;clearInterval(ws.__ka);
  S.wsLabel.value='reconnecting';
  if(!POLL)POLL=setInterval(refresh,6000);

// The asset list is virtualized with Clusterize.js instead of rendering
// every row through Preact - Clusterize owns painting only the rows
// scrolled into view (DOM size stays roughly constant regardless of
// fleet size). It's a foreign-managed DOM subtree (same pattern as
// EChart's canvas), so it's wrapped in its own component: a ref div
// Clusterize is bound to, event delegation for clicks (rows are plain
// strings, not vdom, so no onClick prop exists on them), and a
// MutationObserver-free redraw of sparkline canvases driven by
// Clusterize's own clusterChanged callback.
function AssetList(){
 const fleet=S.fleet.value;
 const sel=S.sel.value;
 S.filter.value;S.query.value;S.health.value; // subscribe
 const holderRef=useRef(null);
 const clusterRef=useRef(null);
 const rows=useMemo(()=>filteredRows(),[fleet,S.filter.value,S.query.value,sel]);
 const drawSparks=()=>{
  if(!holderRef.current)return;
  holderRef.current.querySelectorAll('canvas[data-k]').forEach(cv=>{
   const key=cv.getAttribute('data-k');
   const series=S.health.value[key];
   if(series)spark(cv,series.slice(-120),12);});};
 useEffect(()=>{
  const onClick=(e)=>{
   const row=e.target.closest('.row[data-k]');
   if(row)select(row.getAttribute('data-k'));};
  const list=$('#list');
  list.addEventListener('click',onClick);
  return ()=>list.removeEventListener('click',onClick);
 },[]);
 useEffect(()=>{
  if(!fleet)return;
  if(!rows.length){
   if(clusterRef.current){clusterRef.current.destroy(true);clusterRef.current=null;}
   return;}
  const htmlRows=rows.map(v=>rowHtml(v,sel));
  if(!clusterRef.current||!document.getElementById('list-content')){
   clusterRef.current=new Clusterize({rows:htmlRows,scrollId:'list',contentId:'list-content',
    callbacks:{clusterChanged:drawSparks}});
  }else{
   clusterRef.current.update(htmlRows);
  }
  drawSparks();
 },[rows,sel]);
 useEffect(()=>()=>{if(clusterRef.current)clusterRef.current.destroy(true);},[]);
 if(fleet&&!rows.length)
  return html`<div id="list" ref=${holderRef}><p class="muted" style="padding:24px 20px;line-height:1.7">
   ${fleet.rows.length?'No assets match the filter.'
    :html`No assets in the store yet.<br/>Ingest data into the raw store (acm_data/raw) and the service will discover it on the next start; assets appear here the moment onboarding begins.`}
  </p></div>`;
 return html`<div id="list" ref=${holderRef}><div id="list-content"></div></div>`;}

 const hasMore=rows.length>0||!!falsifiable;

  ${lead?html`<p class="narr-lead" style=${open?'':'margin-bottom:0'}>${lead}</p>`:null}
  ${open&&rows.length?html`<div class="narr-list">${rows}</div>`:null}

   The two-way surface: everything an operator does is reachable here -

async function ctlAct(fn,msg){

function App(){
 useEffect(()=>{
  addEventListener('hashchange',applyHash);
  applyHash();
  const onKey=(e)=>{
   if(e.key==='Escape'&&S.reportOpen.value){hideReport();return;}
   if(S.page.value!=='assets')return;
   const q=$('#q');
   if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q&&q.focus();return;}
   if(e.key==='Escape'&&document.activeElement===q&&S.query.value){
    S.query.value='';localStorage.setItem('acm-query','');return;}
   if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const tag=(document.activeElement||{}).tagName;
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    const rows=filteredRows();if(!rows.length)return;
    e.preventDefault();
    const i=rows.findIndex(r=>r.asset_key===S.sel.value);
    const next=e.key==='ArrowDown'?Math.min(rows.length-1,i+1):Math.max(0,i<0?0:i-1);
    // the list is virtualized (Clusterize) - only the scrolled-into-view
    // rows exist in the DOM, so scroll #list to where the target row
    // WILL be first, so Clusterize's next render (triggered by the
    // selection change) includes it.
    scrollListToIndex(next);
    select(rows[next].asset_key);}};
  document.addEventListener('keydown',onKey);
  actBackfill();
  refresh().then(fetchSparks);
  connect();
