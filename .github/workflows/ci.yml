name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  acm2-fast:
    name: ACM2 fast lane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: acm2
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "acm2/uv.lock"
      - name: Sync environment
        run: uv sync
      - name: Run acm2 tests (unit + import boundary + ASCII scan)
        run: uv run pytest tests -m "not statistical" --tb=short

  acm2-statistical:
    name: ACM2 statistical acceptance lane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acm2
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "acm2/uv.lock"
      - name: Sync environment
        run: uv sync
      - name: Statistical acceptance (immune harness, conformance gates)
        run: uv run pytest tests -m statistical --tb=short
        timeout-minutes: 15

  fast-tests:
    name: Tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install pandas numpy polars pyarrow scikit-learn scipy structlog \
            matplotlib remotezip pytest httpx fastapi uvicorn python-multipart \
            pydantic asyncua paho-mqtt openpyxl
      - name: Run fast tests
        run: python -m pytest tests/ -m "not slow" -v --tb=short

  slow-tests:
    name: Tests (slow)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install pandas numpy polars pyarrow scikit-learn scipy structlog \
            matplotlib remotezip pytest httpx fastapi uvicorn python-multipart \
            pydantic asyncua paho-mqtt openpyxl
      - name: Run slow tests
        run: python -m pytest tests/ -m slow -v --tb=short
        timeout-minutes: 20
