name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast:
    name: ACM fast lane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run fast tests
        run: uv run pytest tests -m "not statistical" --tb=short

  statistical:
    name: ACM statistical acceptance lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Statistical acceptance
        run: uv run pytest tests -m statistical --tb=short
        timeout-minutes: 15
