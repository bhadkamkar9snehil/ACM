# ACM Observability Stack - Docker Compose
# =========================================
# Complete observability stack with Alloy, Grafana, Tempo, Loki, Prometheus, Pyroscope
#
# Usage:
#   docker-compose up -d
#
# Endpoints:
#   Grafana:       http://localhost:3000  (admin/admin)
#   Alloy OTLP:    localhost:4317 (gRPC), localhost:4318 (HTTP)
#   Tempo API:     http://localhost:3200
#   Pyroscope:     http://localhost:4040
#   Loki:          http://localhost:3100
#   Prometheus:    http://localhost:9090

services:
  # ============================================================================
  # Grafana Alloy - OpenTelemetry Collector
  # Receives OTLP from Python apps and routes to backends
  # ============================================================================
  alloy:
    image: grafana/alloy:v1.14.0
    container_name: acm-alloy
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:9099"
      - "--stability.level=generally-available"
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9099:9099"   # Alloy UI/metrics
    volumes:
      - ./config-docker.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # HTTP probe via bash /dev/tcp — wget/curl not available in the alloy image.
      # TCP-only check misses goroutine deadlocks (the v1.13.x WAL GC bug): port appears
      # open but the HTTP handler is frozen. This sends a real GET and checks for "ready".
      test: ["CMD-SHELL", "bash -c 'echo -e \"GET /-/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" > /dev/tcp/localhost/9099'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Grafana - Dashboard and Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:12.4.0
    container_name: acm-grafana
    ports:
      - "3000:3000"   # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-pyroscope-datasource
      # Use the supported remote image renderer service instead of the deprecated plugin.
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=acm-renderer-token-v1
      # Grafana 12.4.0 — all Public Preview feature toggles
      # Source: https://grafana.com/docs/grafana/v12.4/setup-grafana/configure-grafana/feature-toggles/
      - GF_FEATURE_TOGGLES_ENABLE=panelTitleSearch grpcServer renderAuthJWT refactorVariablesTimeRange faroDatasourceSelector enableDatagridEditing externalServiceAccounts dashboardNewLayouts pdfTables canvasPanelPanZoom alertingSaveStateCompressed sqlExpressions queryLibrary savedQueriesRBAC dashboardTemplates alertRuleRestore azureMonitorLogsBuilderEditor logsPanelControls interactiveLearning newGauge newVizSuggestions vizPresets preventPanelChromeOverflow newPanelPadding transformationsEmptyPlaceholder
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      pyroscope:
        condition: service_started
      renderer:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # Grafana Image Renderer - Remote rendering service for dashboard/panel exports
  # ============================================================================
  renderer:
    # Grafana recommends remote rendering. Pin a secure renderer release instead
    # of using the deprecated in-process plugin path.
    image: grafana/grafana-image-renderer:latest
    container_name: acm-grafana-renderer
    environment:
      - AUTH_TOKEN=acm-renderer-token-v1
      - ENABLE_METRICS=true
    restart: unless-stopped

  # ============================================================================
  # Grafana Tempo - Distributed Tracing
  # ============================================================================
  tempo:
    image: grafana/tempo:2.10.1
    container_name: acm-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo API
      - "9095:9095"   # Tempo gRPC
    volumes:
      - ./tempo-docker.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    # Tempo 2.10+ uses distroless image — no wget/curl/sh available inside container.
    # Rely on restart policy; /ready is verified externally via Alloy depends_on.

  # ============================================================================
  # Grafana Pyroscope - Continuous Profiling
  # ============================================================================
  pyroscope:
    image: grafana/pyroscope:1.18.1
    container_name: acm-pyroscope
    user: "0"  # Run as root to fix permission issues
    command: ["-config.file=/etc/pyroscope.yaml"]
    ports:
      - "4040:4040"   # Pyroscope UI/API
      - "4041:4041"   # Pyroscope gRPC
    volumes:
      - ./pyroscope-docker.yaml:/etc/pyroscope.yaml:ro
      - pyroscope-data:/var/pyroscope
    restart: unless-stopped
    # Pyroscope uses a minimal container with no shell/wget/curl
    # Disable healthcheck and rely on restart policy

  # ============================================================================
  # Grafana Loki - Log Aggregation
  # ============================================================================
  loki:
    image: grafana/loki:3.6.7
    container_name: acm-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"   # Loki API
    volumes:
      - ./loki-docker.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    # Loki 3.6+ uses distroless image — no wget/curl/sh available inside container.
    # Rely on restart policy; /ready is verified externally via Alloy depends_on.

  # ============================================================================
  # Prometheus - Metrics Collection
  # Retention: 1 year (365 days) for long-term ACM observability
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: acm-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
      - "--enable-feature=native-histograms"
      - "--storage.tsdb.retention.time=365d"
      - "--storage.tsdb.retention.size=10GB"
    ports:
      - "9090:9090"   # Prometheus UI/API
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  tempo-data:
  pyroscope-data:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: acm-observability
