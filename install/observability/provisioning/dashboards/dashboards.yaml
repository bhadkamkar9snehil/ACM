apiVersion: 1

providers:
  # Active dashboards — shown in "ACM" folder in Grafana
  - name: 'ACM Dashboards'
    orgId: 1
    folder: 'ACM'
    folderUid: 'acm-folder'
    type: file
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
