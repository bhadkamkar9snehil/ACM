apiVersion: 1

providers:
  # Active dashboards — shown in "ACM" folder in Grafana
  - name: 'ACM Dashboards'
    orgId: 1
    folder: 'ACM'
    folderUid: 'acm-folder'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards

  # Archived dashboards — shown in "ACM Archive" folder in Grafana
  - name: 'ACM Archive'
    orgId: 1
    folder: 'ACM Archive'
    folderUid: 'acm-archive-folder'
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 300
    options:
      path: /etc/grafana/dashboards/archive
